<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Episode Guide · MiraculousHub Beta</title><link rel="stylesheet" href="beta.css"><script src="../../firebase.js"></script><script src="beta-auth.js"></script><script src="../../data.js"></script></head><body><div id="betaContent" class="hidden"><header><a href="index.html"><b>Miraculous<span>Hub</span> / Beta</b></a><nav><a href="index.html">Overview</a><a href="discover.html">Discover</a><a href="episodes.html">Episode Guide</a><a href="trailers.html">Trailers</a></nav></header><main><span class="eyebrow">Complete episode guide</span><h1>Every season, one place</h1><p>Find an episode quickly. Thumbnails use a fitted image layout rather than cropping.</p><div class="controls"><select id="season" aria-label="Select season"></select><input id="search" type="search" placeholder="Search episode names…"></div><div id="episodeCount" class="eyebrow"></div><div class="cards" id="episodeGrid"></div></main><footer>Private-preview concepts · No changes to the public homepage</footer></div><script>window.addEventListener("beta-unlocked",()=>{const all=(window.MH_EPISODES||[]).filter(x=>x.available!==false);const sel=document.getElementById("season"),search=document.getElementById("search"),grid=document.getElementById("episodeGrid"),count=document.getElementById("episodeCount");const seasons=[...new Set(all.map(x=>x.season))].sort((a,b)=>b-a);for(const s of seasons){const o=document.createElement("option");o.value=s;o.textContent="Season "+s;sel.append(o)}function render(){grid.replaceChildren();const list=all.filter(e=>String(e.season)===sel.value&&e.title.toLowerCase().includes(search.value.toLowerCase()));count.textContent=list.length+" EPISODES";for(const e of list){const a=document.createElement("a");a.className="card";a.href="../watch.html?season="+e.season+"&episode="+e.episode;if(e.thumbnail){const img=document.createElement("img");img.src=e.thumbnail;img.alt="";img.loading="lazy";a.append(img)}const small=document.createElement("small");small.textContent="EPISODE "+e.episode;const strong=document.createElement("strong");strong.textContent=e.title;a.append(small,strong);grid.append(a)}}sel.addEventListener("change",render);search.addEventListener("input",render);render()})</script></body></html>
