<script>

const WORKER =
  "https://miraculoushub-uploader.ibbyzaman4.workers.dev";


const CHUNK_SIZE =
  20 * 1024 * 1024;


const passwordInput =
  document.getElementById(
    "password"
  );


const typeInput =
  document.getElementById(
    "type"
  );


const seasonInput =
  document.getElementById(
    "season"
  );


const episodeInput =
  document.getElementById(
    "episode"
  );


const specialNameInput =
  document.getElementById(
    "specialName"
  );


const seasonBox =
  document.getElementById(
    "seasonBox"
  );


const episodeBox =
  document.getElementById(
    "episodeBox"
  );


const specialBox =
  document.getElementById(
    "specialBox"
  );


const destination =
  document.getElementById(
    "destination"
  );


const fileInput =
  document.getElementById(
    "fileInput"
  );


const dropZone =
  document.getElementById(
    "dropZone"
  );


const fileCard =
  document.getElementById(
    "fileCard"
  );


const fileName =
  document.getElementById(
    "fileName"
  );


const fileSize =
  document.getElementById(
    "fileSize"
  );


const uploadButton =
  document.getElementById(
    "uploadButton"
  );


const cancelButton =
  document.getElementById(
    "cancelButton"
  );


const progressArea =
  document.getElementById(
    "progressArea"
  );


const progressBar =
  document.getElementById(
    "progressBar"
  );


const progressText =
  document.getElementById(
    "progressText"
  );


const percentage =
  document.getElementById(
    "percentage"
  );


const speed =
  document.getElementById(
    "speed"
  );


const eta =
  document.getElementById(
    "eta"
  );


const part =
  document.getElementById(
    "part"
  );


const status =
  document.getElementById(
    "status"
  );


let selectedFile =
  null;


let currentXHR =
  null;


let cancelled =
  false;


let activeUpload =
  null;


/* =========================================================
   HELPERS
   ========================================================= */


function slugify(value) {

  return value

    .toLowerCase()

    .trim()

    .replace(
      /[^a-z0-9]+/g,
      "-"
    )

    .replace(
      /^-+|-+$/g,
      ""
    );

}


function makeObjectKey() {

  if (
    typeInput.value ===
    "special"
  ) {

    const slug =
      slugify(
        specialNameInput.value
      );


    if (!slug) {

      throw new Error(
        "Enter the special's name."
      );

    }


    return (
      "specials/" +
      slug +
      ".mp4"
    );

  }


  const season =
    Number(
      seasonInput.value
    );


  const episode =
    Number(
      episodeInput.value
    );


  if (
    !Number.isInteger(season) ||
    season < 1 ||
    season > 99
  ) {

    throw new Error(
      "Invalid season."
    );

  }


  if (
    !Number.isInteger(episode) ||
    episode < 1 ||
    episode > 99
  ) {

    throw new Error(
      "Enter a valid episode number."
    );

  }


  return (
    "season-" +
    season +
    "/s" +
    String(season).padStart(
      2,
      "0"
    ) +
    "e" +
    String(episode).padStart(
      2,
      "0"
    ) +
    ".mp4"
  );

}


function updateDestination() {

  try {

    const key =
      makeObjectKey();


    destination.innerHTML =
      "<strong>R2 destination</strong>" +
      key;

  } catch {

    destination.innerHTML =
      "<strong>R2 destination</strong>" +
      "Choose an episode or special.";

  }


  checkReady();

}


function formatBytes(bytes) {

  if (!Number.isFinite(bytes)) {
    return "—";
  }


  const units = [
    "B",
    "KB",
    "MB",
    "GB",
    "TB"
  ];


  let value =
    bytes;


  let unit =
    0;


  while (
    value >= 1024 &&
    unit < units.length - 1
  ) {

    value /=
      1024;

    unit++;

  }


  return (
    value.toFixed(
      unit === 0
        ? 0
        : 1
    ) +
    " " +
    units[unit]
  );

}


function formatTime(seconds) {

  if (
    !Number.isFinite(seconds) ||
    seconds < 0
  ) {

    return "—";

  }


  if (seconds < 60) {

    return (
      Math.ceil(seconds) +
      "s"
    );

  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  const remaining =
    Math.ceil(
      seconds % 60
    );


  return (
    minutes +
    "m " +
    remaining +
    "s"
  );

}


function setStatus(
  message,
  type = ""
) {

  status.textContent =
    message;


  status.className =
    "status " +
    type;

}


function checkReady() {

  let validDestination =
    false;


  try {

    makeObjectKey();

    validDestination =
      true;

  } catch {}


  uploadButton.disabled =
    !selectedFile ||
    !passwordInput.value ||
    !validDestination;

}


/* =========================================================
   TYPE SWITCHER
   ========================================================= */


typeInput.addEventListener(
  "change",
  () => {

    const special =
      typeInput.value ===
      "special";


    seasonBox.classList.toggle(
      "hidden",
      special
    );


    episodeBox.classList.toggle(
      "hidden",
      special
    );


    specialBox.classList.toggle(
      "hidden",
      !special
    );


    updateDestination();

  }
);


/* =========================================================
   INPUTS
   ========================================================= */


passwordInput.addEventListener(
  "input",
  checkReady
);


seasonInput.addEventListener(
  "change",
  updateDestination
);


episodeInput.addEventListener(
  "input",
  updateDestination
);


specialNameInput.addEventListener(
  "input",
  updateDestination
);


/* =========================================================
   FILE
   ========================================================= */


dropZone.addEventListener(
  "click",
  () =>
    fileInput.click()
);


dropZone.addEventListener(
  "dragover",
  event => {

    event.preventDefault();

    dropZone.classList.add(
      "dragging"
    );

  }
);


dropZone.addEventListener(
  "dragleave",
  () => {

    dropZone.classList.remove(
      "dragging"
    );

  }
);


dropZone.addEventListener(
  "drop",
  event => {

    event.preventDefault();

    dropZone.classList.remove(
      "dragging"
    );


    const file =
      event.dataTransfer
        .files[0];


    if (file) {

      chooseFile(file);

    }

  }
);


fileInput.addEventListener(
  "change",
  () => {

    const file =
      fileInput.files[0];


    if (file) {

      chooseFile(file);

    }

  }
);


function chooseFile(file) {

  if (
    !file.name
      .toLowerCase()
      .endsWith(".mp4")
  ) {

    setStatus(
      "Please choose an MP4 video.",
      "error"
    );

    return;

  }


  selectedFile =
    file;


  fileName.textContent =
    file.name;


  fileSize.textContent =
    formatBytes(
      file.size
    );


  fileCard.style.display =
    "block";


  setStatus("");


  checkReady();

}


/* =========================================================
   WORKER REQUEST
   ========================================================= */


async function workerRequest(
  action,
  key,
  options = {}
) {

  const params =
    new URLSearchParams({
      action,
      key
    });


  if (options.uploadId) {

    params.set(
      "uploadId",
      options.uploadId
    );

  }


  if (options.partNumber) {

    params.set(
      "partNumber",
      options.partNumber
    );

  }


  const response =
    await fetch(

      WORKER +
      "/upload?" +
      params.toString(),

      {

        method:
          options.method ||
          "POST",


        headers: {

          "X-Upload-Password":
            passwordInput.value,


          ...(options.json
            ? {
                "Content-Type":
                  "application/json"
              }
            : {})

        },


        body:
          options.json
            ? JSON.stringify(
                options.json
              )
            : undefined

      }

    );


  let result;


  try {

    result =
      await response.json();

  } catch {

    throw new Error(
      "Uploader returned an invalid response."
    );

  }


  if (!response.ok) {

    throw new Error(
      result.error ||
      "Upload request failed."
    );

  }


  return result;

}


/* =========================================================
   UPLOAD ONE PART
   ========================================================= */


function uploadPart({

  blob,

  key,

  uploadId,

  partNumber,

  alreadyUploaded,

  startTime

}) {


  return new Promise(
    (
      resolve,
      reject
    ) => {


      const params =
        new URLSearchParams({

          action:
            "part",

          key,

          uploadId,

          partNumber:
            String(partNumber)

        });


      const xhr =
        new XMLHttpRequest();


      currentXHR =
        xhr;


      xhr.open(

        "PUT",

        WORKER +
        "/upload?" +
        params.toString()

      );


      xhr.setRequestHeader(

        "X-Upload-Password",

        passwordInput.value

      );


      xhr.upload.onprogress =
        event => {


          if (
            !event.lengthComputable
          ) {

            return;

          }


          const currentBytes =
            alreadyUploaded +
            event.loaded;


          const progress =
            Math.min(

              currentBytes /
              selectedFile.size,

              1

            );


          const percent =
            progress * 100;


          progressBar.style.width =
            percent.toFixed(2) +
            "%";


          percentage.textContent =
            percent.toFixed(1) +
            "%";


          const elapsed =
            (
              Date.now() -
              startTime
            ) /
            1000;


          const bytesPerSecond =
            elapsed > 0
              ? currentBytes /
                elapsed
              : 0;


          speed.textContent =
            formatBytes(
              bytesPerSecond
            ) +
            "/s";


          const remainingBytes =
            selectedFile.size -
            currentBytes;


          eta.textContent =
            bytesPerSecond > 0
              ? formatTime(
                  remainingBytes /
                  bytesPerSecond
                )
              : "—";

        };


      xhr.onload =
        () => {


          currentXHR =
            null;


          let result;


          try {

            result =
              JSON.parse(
                xhr.responseText
              );

          } catch {

            reject(
              new Error(
                "Invalid upload response."
              )
            );

            return;

          }


          if (
            xhr.status < 200 ||
            xhr.status >= 300
          ) {

            reject(
              new Error(
                result.error ||
                "Part upload failed."
              )
            );

            return;

          }


          resolve(result);

        };


      xhr.onerror =
        () => {

          currentXHR =
            null;

          reject(
            new Error(
              "Network error while uploading."
            )
          );

        };


      xhr.onabort =
        () => {

          currentXHR =
            null;

          reject(
            new Error(
              "Upload cancelled."
            )
          );

        };


      xhr.send(blob);

    }
  );

}


/* =========================================================
   START
   ========================================================= */


uploadButton.addEventListener(
  "click",
  startUpload
);


async function startUpload() {

  if (!selectedFile) {
    return;
  }


  let key;


  try {

    key =
      makeObjectKey();

  } catch (error) {

    setStatus(
      error.message,
      "error"
    );

    return;

  }


  cancelled =
    false;


  uploadButton.disabled =
    true;


  cancelButton.style.display =
    "block";


  progressArea.style.display =
    "block";


  progressBar.style.width =
    "0%";


  percentage.textContent =
    "0%";


  speed.textContent =
    "—";


  eta.textContent =
    "—";


  setStatus(
    "Creating multipart upload…"
  );


  const startTime =
    Date.now();


  try {


    const created =
      await workerRequest(
        "create",
        key
      );


    activeUpload = {

      key,

      uploadId:
        created.uploadId

    };


    const totalParts =
      Math.ceil(

        selectedFile.size /
        CHUNK_SIZE

      );


    const uploadedParts =
      [];


    for (
      let index = 0;
      index < totalParts;
      index++
    ) {


      if (cancelled) {

        throw new Error(
          "Upload cancelled."
        );

      }


      const partNumber =
        index + 1;


      const start =
        index *
        CHUNK_SIZE;


      const end =
        Math.min(

          start +
          CHUNK_SIZE,

          selectedFile.size

        );


      const blob =
        selectedFile.slice(
          start,
          end
        );


      part.textContent =
        partNumber +
        " / " +
        totalParts;


      progressText.textContent =
        "Uploading part " +
        partNumber +
        " of " +
        totalParts;


      const result =
        await uploadPart({

          blob,

          key,

          uploadId:
            created.uploadId,

          partNumber,

          alreadyUploaded:
            start,

          startTime

        });


      uploadedParts.push({

        partNumber:
          result.partNumber,

        etag:
          result.etag

      });

    }


    progressText.textContent =
      "Finishing upload…";


    setStatus(
      "All parts uploaded. Finalising video…"
    );


    await workerRequest(

      "complete",

      key,

      {

        uploadId:
          created.uploadId,

        json: {

          parts:
            uploadedParts

        }

      }

    );


    progressBar.style.width =
      "100%";


    percentage.textContent =
      "100%";


    progressText.textContent =
      "Complete";


    setStatus(

      "✓ Uploaded successfully: " +
      key,

      "success"

    );


    activeUpload =
      null;


    cancelButton.style.display =
      "none";


  } catch (error) {


    if (
      activeUpload &&
      !cancelled
    ) {

      try {

        await workerRequest(

          "abort",

          activeUpload.key,

          {

            uploadId:
              activeUpload.uploadId

          }

        );

      } catch {}

    }


    setStatus(

      error.message ||
      "Upload failed.",

      "error"

    );


    activeUpload =
      null;


    cancelButton.style.display =
      "none";


    uploadButton.disabled =
      false;

  }

}


/* =========================================================
   CANCEL
   ========================================================= */


cancelButton.addEventListener(
  "click",
  async () => {


    cancelled =
      true;


    if (currentXHR) {

      currentXHR.abort();

    }


    cancelButton.disabled =
      true;


    setStatus(
      "Cancelling upload…"
    );


    if (activeUpload) {

      try {

        await workerRequest(

          "abort",

          activeUpload.key,

          {

            uploadId:
              activeUpload.uploadId

          }

        );

      } catch {}

    }


    activeUpload =
      null;


    setStatus(
      "Upload cancelled."
    );


    cancelButton.style.display =
      "none";


    cancelButton.disabled =
      false;


    uploadButton.disabled =
      false;

  }
);


updateDestination();

</script>
