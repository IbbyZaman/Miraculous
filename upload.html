<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MiraculousHub · R2 Uploader</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,sans-serif;background:#090911;color:#fff;display:grid;place-items:center;padding:20px;background-image:radial-gradient(circle at 15% 10%,rgba(255,50,120,.18),transparent 34%),radial-gradient(circle at 85% 80%,rgba(120,70,255,.18),transparent 34%)}
main{width:min(680px,100%);padding:28px;border:1px solid rgba(255,255,255,.13);border-radius:28px;background:rgba(24,24,36,.88);box-shadow:0 28px 80px rgba(0,0,0,.42)}h1{margin:0;font-size:clamp(28px,6vw,42px)}p{color:#aaa;line-height:1.5}label{display:block;margin:18px 0 7px;font-size:13px;font-weight:800;color:#c8c8d2}input,select,button{width:100%;font:inherit;border-radius:15px;padding:14px 15px}input,select{color:#fff;background:#15151f;border:1px solid rgba(255,255,255,.12);outline:none}select option{background:#15151f}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.dest,.file{margin-top:16px;padding:13px 15px;border-radius:15px;background:rgba(255,255,255,.05);color:#aaa;overflow-wrap:anywhere}.drop{margin-top:18px;border:2px dashed rgba(255,255,255,.16);border-radius:20px;padding:28px;text-align:center;cursor:pointer}.drop.drag{border-color:#ff4d91;background:rgba(255,255,255,.04)}#file{display:none}button{margin-top:18px;border:0;color:#fff;font-weight:850;cursor:pointer;background:linear-gradient(100deg,#ff376f,#e72480,#a535ef)}button:disabled{opacity:.45;cursor:not-allowed}.cancel{display:none;background:#242432}.progress{display:none;margin-top:20px}.bar{height:11px;background:#242432;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#ff376f,#a535ef)}.progressTop{display:flex;justify-content:space-between;margin-bottom:8px;color:#bbb}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#15151f;padding:10px;border-radius:12px;text-align:center}.stat b{display:block}.stat span{font-size:11px;color:#888}.status{min-height:22px;margin-top:16px;text-align:center;color:#bbb}.ok{color:#72f0c8}.err{color:#ff7a9b}@media(max-width:520px){main{padding:21px}.row,.stats{grid-template-columns:1fr}}
</style></head><body><main>
<h1>R2 Uploader</h1><p>Pick the exact episode or special. The filename does not matter — the uploader puts it at the R2 key the website already expects.</p>
<label>Upload password</label><input id="password" type="password" autocomplete="current-password" placeholder="Private upload password">
<div class="row"><div><label>Type</label><select id="type"><option value="episode">Episode</option><option value="special">Special</option></select></div><div id="seasonWrap"><label>Season</label><select id="season"></select></div></div>
<div id="episodeWrap"><label>Episode</label><select id="episode"></select></div>
<div id="specialWrap" class="hidden"><label>Special</label><select id="special"><option value="new-york">New York: United Heroez</option><option value="shanghai">Shanghai: The Legend of Lady Dragon</option><option value="awakening">Awakening - The Movie</option><option value="paris">Miraculous World Paris</option><option value="london">London: At the Edge of Time</option><option value="tokyo">Miraculous World: Tokyo, Stellar Force</option></select></div>
<div class="dest" id="dest"></div><div class="drop" id="drop"><b>Choose MP4</b><br><span style="color:#888">Tap here or drag the video in</span></div><input id="file" type="file" accept="video/mp4,.mp4"><div class="file" id="fileInfo" hidden></div>
<button id="upload" disabled>Upload to R2</button><button id="cancel" class="cancel">Cancel upload</button>
<div class="progress" id="progress"><div class="progressTop"><span id="progressText">Preparing…</span><b id="pct">0%</b></div><div class="bar"><div class="fill" id="fill"></div></div><div class="stats"><div class="stat"><b id="speed">—</b><span>SPEED</span></div><div class="stat"><b id="eta">—</b><span>ETA</span></div><div class="stat"><b id="part">—</b><span>PART</span></div></div></div><div class="status" id="status"></div>
</main><script>
const WORKER="https://miraculoushub-uploader.ibbyzaman4.workers.dev",CHUNK=20*1024*1024,$=id=>document.getElementById(id);
for(let s=1;s<=7;s++)$("season").insertAdjacentHTML("beforeend",`<option value="${s}" ${s===6?"selected":""}>Season ${s}</option>`);
for(let e=1;e<=27;e++)$("episode").insertAdjacentHTML("beforeend",`<option value="${e}">Episode ${e}</option>`);
let selected=null,xhr=null,active=null,cancelled=false;
function key(){if($("type").value==="special")return `specials/${$("special").value}.mp4`;const s=Number($("season").value),e=Number($("episode").value);return `season-${s}/s${String(s).padStart(2,"0")}e${String(e).padStart(2,"0")}.mp4`}
function ready(){$("dest").innerHTML=`<b>R2 destination</b><br>${key()}`;$("upload").disabled=!selected||!$("password").value}
function bytes(n){const u=["B","KB","MB","GB"];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`}
function time(n){if(!isFinite(n)||n<0)return"—";if(n<60)return `${Math.ceil(n)}s`;return `${Math.floor(n/60)}m ${Math.ceil(n%60)}s`}
function msg(t,c=""){$("status").textContent=t;$("status").className=`status ${c}`}
$("type").onchange=()=>{const sp=$("type").value==="special";$("seasonWrap").classList.toggle("hidden",sp);$("episodeWrap").classList.toggle("hidden",sp);$("specialWrap").classList.toggle("hidden",!sp);ready()};["season","episode","special"].forEach(id=>$(id).onchange=ready);$("password").oninput=ready;
$("drop").onclick=()=>$("file").click();$("drop").ondragover=e=>{e.preventDefault();$("drop").classList.add("drag")};$("drop").ondragleave=()=>$("drop").classList.remove("drag");$("drop").ondrop=e=>{e.preventDefault();$("drop").classList.remove("drag");choose(e.dataTransfer.files[0])};$("file").onchange=()=>choose($("file").files[0]);
function choose(f){if(!f||!f.name.toLowerCase().endsWith(".mp4")){msg("Choose an MP4 file.","err");return}selected=f;$("fileInfo").hidden=false;$("fileInfo").textContent=`${f.name} · ${bytes(f.size)}`;msg("");ready()}
async function req(action,k,opt={}){const q=new URLSearchParams({action,key:k});if(opt.uploadId)q.set("uploadId",opt.uploadId);if(opt.partNumber)q.set("partNumber",opt.partNumber);const r=await fetch(`${WORKER}/upload?${q}`,{method:opt.method||"POST",headers:{"X-Upload-Password":$("password").value,...(opt.json?{"Content-Type":"application/json"}:{})},body:opt.json?JSON.stringify(opt.json):undefined});let d;try{d=await r.json()}catch{throw new Error("Invalid uploader response")};if(!r.ok)throw new Error(d.error||"Upload request failed");return d}
function putPart(blob,k,uploadId,partNumber,done,startTime){return new Promise((resolve,reject)=>{const q=new URLSearchParams({action:"part",key:k,uploadId,partNumber:String(partNumber)});xhr=new XMLHttpRequest();xhr.open("PUT",`${WORKER}/upload?${q}`);xhr.setRequestHeader("X-Upload-Password",$("password").value);xhr.upload.onprogress=e=>{if(!e.lengthComputable)return;const current=done+e.loaded,p=current/selected.size,elapsed=(Date.now()-startTime)/1000,bps=elapsed?current/elapsed:0;$("fill").style.width=`${Math.min(100,p*100)}%`;$("pct").textContent=`${(p*100).toFixed(1)}%`;$("speed").textContent=`${bytes(bps)}/s`;$("eta").textContent=bps?time((selected.size-current)/bps):"—"};xhr.onload=function(){xhr=null;let d;try{d=JSON.parse(this.responseText)}catch{return reject(new Error("Invalid upload response"))}if(this.status<200||this.status>=300)return reject(new Error(d.error||"Part upload failed"));resolve(d)};xhr.onerror=()=>{xhr=null;reject(new Error("Network error while uploading"))};xhr.onabort=()=>{xhr=null;reject(new Error("Upload cancelled"))};xhr.send(blob)})}
$("upload").onclick=async()=>{if(!selected)return;const k=key();cancelled=false;$("upload").disabled=true;$("cancel").style.display="block";$("progress").style.display="block";$("fill").style.width="0";$("pct").textContent="0%";msg("Creating upload…");const started=Date.now();try{const created=await req("create",k);active={key:k,uploadId:created.uploadId};const total=Math.ceil(selected.size/CHUNK),parts=[];for(let i=0;i<total;i++){if(cancelled)throw new Error("Upload cancelled");const n=i+1,start=i*CHUNK,end=Math.min(start+CHUNK,selected.size);$("part").textContent=`${n} / ${total}`;$("progressText").textContent=`Uploading part ${n} of ${total}`;const r=await putPart(selected.slice(start,end),k,created.uploadId,n,start,started);parts.push({partNumber:r.partNumber,etag:r.etag})}$("progressText").textContent="Finishing…";await req("complete",k,{uploadId:created.uploadId,json:{parts}});$("fill").style.width="100%";$("pct").textContent="100%";$("progressText").textContent="Complete";msg(`✓ Uploaded. Website route is live automatically: ${k}`,"ok");active=null;$("cancel").style.display="none"}catch(e){if(active&&!cancelled){try{await req("abort",active.key,{uploadId:active.uploadId})}catch{}}msg(e.message||"Upload failed","err");active=null;$("cancel").style.display="none";ready()}};
$("cancel").onclick=async()=>{cancelled=true;if(xhr)xhr.abort();$("cancel").disabled=true;msg("Cancelling…");if(active){try{await req("abort",active.key,{uploadId:active.uploadId})}catch{}}active=null;$("cancel").style.display="none";$("cancel").disabled=false;msg("Upload cancelled");ready()};ready();
</script></body></html>
