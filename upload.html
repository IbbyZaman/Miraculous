<style>

</head><body><main>
<h1>R2 Uploader</h1><p>Pick the exact Miraculous episode, special, or monthly anime episode. The filename does not matter — the uploader puts it at the R2 key the website already expects.</p>
<label>Upload password</label><input id="password" type="password" autocomplete="current-password" placeholder="Private upload password">
<div class="row"><div><label>Type</label><select id="type"><option value="episode">Episode</option><option value="special">Special</option><option value="anime">Anime</option></select></div><div id="seasonWrap"><label>Season</label><select id="season"></select></div></div>
<div id="episodeWrap"><label>Episode</label><select id="episode"></select></div>
<div id="specialWrap" class="hidden"><label>Special</label><select id="special"><option value="new-york">New York: United Heroez</option><option value="shanghai">Shanghai: The Legend of Lady Dragon</option><option value="awakening">Awakening - The Movie</option><option value="paris">Miraculous World Paris</option><option value="london">London: At the Edge of Time</option><option value="tokyo">Miraculous World: Tokyo, Stellar Force</option></select></div>

<div id="animeWrap" class="hidden"><div class="row"><div><label>Anime</label><select id="anime"></select></div><div><label>Episode</label><select id="animeEpisode"></select></div></div></div>
<div class="dest" id="dest"></div><div class="drop" id="drop"><b>Choose MP4</b><br><span style="color:#888">Tap here or drag the video in</span></div><input id="file" type="file" accept="video/mp4,.mp4"><div class="file" id="fileInfo" hidden></div>
<button id="upload" disabled>Upload to R2</button><button id="cancel" class="cancel">Cancel upload</button>
<div class="progress" id="progress"><div class="progressTop"><span id="progressText">Preparing…</span><b id="pct">0%</b></div><div class="bar"><div class="fill" id="fill"></div></div><div class="stats"><div class="stat"><b id="speed">—</b><span>SPEED</span></div><div class="stat"><b id="eta">—</b><span>ETA</span></div><div class="stat"><b id="part">—</b><span>PART</span></div></div></div><div class="status" id="status"></div>
</main><script src="site-config.js?v=aot-party-1"></script><script src="anime-data.js?v=black-clover-player-2"></script><script>
const WORKER=window.MH_SITE_CONFIG.uploaderWorker,CHUNK=20*1024*1024,$=id=>document.getElementById(id);
for(let s=1;s<=7;s++)$("season").insertAdjacentHTML("beforeend",`<option value="${s}" ${s===6?"selected":""}>Season ${s}</option>`);
for(let e=1;e<=27;e++)$("episode").insertAdjacentHTML("beforeend",`<option value="${e}">Episode ${e}</option>`);
for(const show of window.MH_ANIME_SHOWS){const option=document.createElement("option");option.value=show.slug;option.textContent=show.title;$("anime").append(option)}
function animeEntry(){return window.MH_ANIME_SHOWS.find(x=>x.slug===$("anime").value)?.episodes.find(x=>x.episode===Number($("animeEpisode").value))}
function animeOptions(){
 $("animeEpisode").replaceChildren();const show=window.MH_ANIME_SHOWS.find(x=>x.slug===$("anime").value);let group;
 for(const e of show?.episodes||[]){const section=e.section||show.title;if(!group||group.label!==section){group=document.createElement("optgroup");group.label=section;$("animeEpisode").append(group)}const option=document.createElement("option");option.value=e.episode;option.textContent=`${e.label||"Episode "+e.episode} — ${e.title}`;group.append(option)}
}animeOptions();
let selected=null,xhr=null,active=null,cancelled=false,busy=false;
function lock(on){busy=on;["type","season","episode","special","anime","animeEpisode","password","file"].forEach(id=>$(id).disabled=on);$("drop").setAttribute("aria-disabled",String(on));ready()}
function key(){if($("type").value==="special")return `specials/${$("special").value}.mp4`;if($("type").value==="anime")return animeEntry().r2Key;const s=Number($("season").value),e=Number($("episode").value);return `season-${s}/s${String(s).padStart(2,"0")}e${String(e).padStart(2,"0")}.mp4`}
function watchPath(k){let m;if((m=/^anime\/([a-z0-9-]+)\/(e|sp|oad)(\d+)\.mp4$/.exec(k))){const number=Number(m[3])+(m[2]==="sp"?94:m[2]==="oad"?100:0);return `watch.html?anime=${m[1]}&episode=${number}`}if((m=/^season-\d+\/s(\d+)e(\d+)\.mp4$/.exec(k)))return `watch.html?season=${Number(m[1])}&episode=${Number(m[2])}`;const slugs=["new-york","shanghai","awakening","paris","london","tokyo"];return `watch.html?special=${slugs.indexOf(k.split("/")[1].replace(".mp4",""))+1}`}
function ready(){const k=key();$("dest").replaceChildren();const title=document.createElement("b");title.textContent="R2 destination";const path=document.createElement("div");path.textContent=k;const link=document.createElement("a");link.href=watchPath(k);link.textContent="Open the prepared episode page ↗";link.style.color="#b6a5ff";$("dest").append(title,path,link);$("upload").disabled=busy||!selected||!$("password").value}
function bytes(n){const u=["B","KB","MB","GB"];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`}
function time(n){if(!isFinite(n)||n<0)return"—";if(n<60)return `${Math.ceil(n)}s`;return `${Math.floor(n/60)}m ${Math.ceil(n%60)}s`}
function msg(t,c=""){$("status").textContent=t;$("status").className=`status ${c}`}
$("type").onchange=()=>{const t=$("type").value,sp=t==="special",an=t==="anime";$("seasonWrap").classList.toggle("hidden",sp||an);$("episodeWrap").classList.toggle("hidden",sp||an);$("specialWrap").classList.toggle("hidden",!sp);$("animeWrap").classList.toggle("hidden",!an);ready()};["season","episode","special","anime","animeEpisode"].forEach(id=>$(id).onchange=ready);$("anime").onchange=()=>{animeOptions();ready()};$("password").oninput=ready;
$("drop").onclick=()=>$("file").click();$("drop").ondragover=e=>{e.preventDefault();$("drop").classList.add("drag")};$("drop").ondragleave=()=>$("drop").classList.remove("drag");$("drop").ondrop=e=>{e.preventDefault();$("drop").classList.remove("drag");choose(e.dataTransfer.files[0])};$("file").onchange=()=>choose($("file").files[0]);
function choose(f){if(busy)return;if(!f||!f.name.toLowerCase().endsWith(".mp4")){msg("Choose an MP4 file.","err");return}selected=f;$("fileInfo").hidden=false;$("fileInfo").textContent=`${f.name} · ${bytes(f.size)}`;msg("");ready()}
async function req(action,k,opt={}){const q=new URLSearchParams({action,key:k});if(opt.uploadId)q.set("uploadId",opt.uploadId);if(opt.partNumber)q.set("partNumber",opt.partNumber);const r=await fetch(`${WORKER}/upload?${q}`,{method:opt.method||"POST",signal:AbortSignal.timeout(30000),headers:{"X-Upload-Password":$("password").value,...(opt.json?{"Content-Type":"application/json"}:{})},body:opt.json?JSON.stringify(opt.json):undefined});let d;try{d=await r.json()}catch{throw new Error("Invalid uploader response")};if(!r.ok)throw new Error(d.error||"Upload request failed");return d}
function putPart(blob,k,uploadId,partNumber,done,startTime){return new Promise((resolve,reject)=>{const q=new URLSearchParams({action:"part",key:k,uploadId,partNumber:String(partNumber)});xhr=new XMLHttpRequest();xhr.open("PUT",`${WORKER}/upload?${q}`);xhr.setRequestHeader("X-Upload-Password",$("password").value);xhr.upload.onprogress=e=>{if(!e.lengthComputable)return;const current=done+e.loaded,p=current/selected.size,elapsed=(Date.now()-startTime)/1000,bps=elapsed?current/elapsed:0;$("fill").style.width=`${Math.min(100,p*100)}%`;$("pct").textContent=`${(p*100).toFixed(1)}%`;$("speed").textContent=`${bytes(bps)}/s`;$("eta").textContent=bps?time((selected.size-current)/bps):"—"};xhr.onload=function(){xhr=null;let d;try{d=JSON.parse(this.responseText)}catch{return reject(new Error("Invalid upload response"))}if(this.status<200||this.status>=300)return reject(new Error(d.error||"Part upload failed"));resolve(d)};xhr.onerror=()=>{xhr=null;reject(new Error("Network error while uploading"))};xhr.onabort=()=>{xhr=null;reject(new Error("Upload cancelled"))};xhr.send(blob)})}
$("upload").onclick=async()=>{if(!selected||busy)return;const k=key();lock(true);cancelled=false;$("upload").disabled=true;$("cancel").style.display="block";$("cancel").disabled=false;$("progress").style.display="block";$("fill").style.width="0";$("pct").textContent="0%";msg("Creating upload…");const started=Date.now();try{const created=await req("create",k);active={key:k,uploadId:created.uploadId};const total=Math.ceil(selected.size/CHUNK),parts=[];for(let i=0;i<total;i++){if(cancelled)throw new Error("Upload cancelled");const n=i+1,start=i*CHUNK,end=Math.min(start+CHUNK,selected.size);$("part").textContent=`${n} / ${total}`;$("progressText").textContent=`Uploading part ${n} of ${total}`;const r=await putPart(selected.slice(start,end),k,created.uploadId,n,start,started);parts.push({partNumber:r.partNumber,etag:r.etag})}$("progressText").textContent="Finishing…";$("cancel").disabled=true;await req("complete",k,{uploadId:created.uploadId,json:{parts}});$("fill").style.width="100%";$("pct").textContent="100%";$("progressText").textContent="Complete";msg(`✓ Uploaded. Website route is live automatically: ${k}`,"ok");active=null;$("cancel").style.display="none";const link=document.createElement("a");link.href=watchPath(k);link.textContent=" Open episode ↗";link.style.color="inherit";$("status").append(link);lock(false)}catch(e){if(active){try{await req("abort",active.key,{uploadId:active.uploadId})}catch{}}msg(cancelled?"Upload cancelled":e.message||"Upload failed",cancelled?"":"err");active=null;$("cancel").style.display="none";$("cancel").disabled=false;lock(false)}};
$("cancel").onclick=()=>{if(!busy||$("cancel").disabled)return;cancelled=true;$("cancel").disabled=true;msg("Cancelling…");if(xhr)xhr.abort();};ready();
</script></body></html>
