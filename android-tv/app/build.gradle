plugins { id 'com.android.application' }
android { namespace 'uk.co.miraculoushub.tv'; compileSdk 35
    defaultConfig { applicationId 'uk.co.miraculoushub.tv'; minSdk 23; targetSdk 35; versionCode = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1'); versionName = "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '1'}" }
    signingConfigs {
        debug {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'androidx.core:core:1.15.0'
 implementation 'com.google.zxing:core:3.5.3'
 implementation 'com.google.firebase:firebase-auth:23.2.1'
 implementation 'com.google.firebase:firebase-firestore:25.1.4'
 implementation 'com.github.bumptech.glide:glide:4.16.0'
 implementation 'androidx.media3:media3-exoplayer:1.5.1'
 implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
 implementation 'androidx.media3:media3-ui:1.5.1'
}

