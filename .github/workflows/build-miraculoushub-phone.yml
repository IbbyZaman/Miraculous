name: Build MiraculousHub Phone APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-phone/**'
      - '.github/workflows/build-miraculoushub-phone.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-phone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # Reuse the same debug certificate between builds so Android can update
      # an installed development APK rather than rejecting its signature.
      # A production app should use a private release keystore held in Actions secrets.
      - name: Restore phone signing certificate
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: miraculoushub-phone-signing-v1
      - name: Ensure persistent debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -f "$HOME/.android/debug.keystore"
      - name: Show build version
        run: echo "Phone versionCode = $GITHUB_RUN_NUMBER"
      - name: Build Phone APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Print signing certificate fingerprint
        run: keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | grep -E 'SHA1:|SHA256:'
      - uses: actions/upload-artifact@v4
        with:
          name: MiraculousHubPhone-APK
          path: android-phone/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MiraculousHubPhone.apk
      - name: Publish phone update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phone-build-${{ github.run_number }}
          name: MiraculousHub Phone update ${{ github.run_number }}
          files: android-phone/MiraculousHubPhone.apk
          generate_release_notes: false

      # The website download buttons point to these first-party APK mirrors.
      # The package + JSON are committed together, so SHA256 and version match.
      # A separate Pages deployment workflow publishes the site afterward.
      - name: Mirror verified phone APK to website downloads
        working-directory: .
        env:
          APK_BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mh-apk-mirror
          cp "android-phone/MiraculousHubPhone.apk" "/tmp/mh-apk-mirror/MiraculousHubPhone.apk"
          SHA256=$(sha256sum "/tmp/mh-apk-mirror/MiraculousHubPhone.apk" | cut -d ' ' -f1)
          cat > "/tmp/mh-apk-mirror/phone.json" <<JSON
          {"versionCode":${APK_BUILD},"versionName":"1.0.${APK_BUILD}","url":"https://miraculoushub.co.uk/downloads/MiraculousHubPhone.apk","sha256":"${SHA256}"}
          JSON
          git config user.name "MiraculousHub Build Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mirror-downloads origin/main
            mkdir -p downloads
            EXISTING=$(python3 -c 'import json, pathlib; p=pathlib.Path("downloads/phone.json"); print(json.loads(p.read_text()).get("versionCode",0) if p.exists() else 0)' || echo 0)
            if [ "$EXISTING" -ge "$APK_BUILD" ]; then
              echo "Mirror already has build $EXISTING — skipping outdated build $APK_BUILD."
              exit 0
            fi
            cp "/tmp/mh-apk-mirror/MiraculousHubPhone.apk" "downloads/MiraculousHubPhone.apk"
            cp "/tmp/mh-apk-mirror/phone.json" "downloads/phone.json"
            git add "downloads/MiraculousHubPhone.apk" "downloads/phone.json"
            git commit -m "Mirror phone APK build ${APK_BUILD} for direct website downloads"
            if git push origin HEAD:main; then
              echo "Published phone APK build ${APK_BUILD} to first-party mirror branch."
              exit 0
            fi
            sleep 3
          done
          echo "Could not update first-party APK mirror after retrying."
          exit 1
