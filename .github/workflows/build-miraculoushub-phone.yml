name: Build MiraculousHub Phone APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-phone/**'
      - '.github/workflows/build-miraculoushub-phone.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android-phone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Phone APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MiraculousHubPhone-APK
          path: android-phone/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
