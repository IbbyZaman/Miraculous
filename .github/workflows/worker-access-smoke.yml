name: Check MiraculousHub Worker access for website and Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/worker-access-smoke.cjs'
      - '.github/workflows/worker-access-smoke.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed Worker access rules without downloading media
        run: node scripts/worker-access-smoke.cjs
