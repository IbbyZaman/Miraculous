name: Build MiraculousHub TV APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'android-tv/**'
      - 'MiraculousHubTV-redesign-source (1).zip'
      - '.github/workflows/build-miraculoushub-tv.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract the exact uploaded TV source ZIP
        run: |
          set -euo pipefail
          test -f "MiraculousHubTV-redesign-source (1).zip"
          mkdir -p uploaded-tv-source
          unzip -q "MiraculousHubTV-redesign-source (1).zip" -d uploaded-tv-source
          if [ -f uploaded-tv-source/android-tv/build.gradle ]; then
            echo "TV_PROJECT_DIR=uploaded-tv-source/android-tv" >> "$GITHUB_ENV"
          elif [ -f uploaded-tv-source/build.gradle ]; then
            echo "TV_PROJECT_DIR=uploaded-tv-source" >> "$GITHUB_ENV"
          else
            echo "Could not find build.gradle in the uploaded ZIP:"
            find uploaded-tv-source -maxdepth 4 -type f | head -80
            exit 1
          fi
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore permanent TV development signing certificate
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: miraculoushub-tv-signing-v1
      - name: Ensure TV signing certificate
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Build Android TV APK from uploaded ZIP
        run: gradle --no-daemon -p "$TV_PROJECT_DIR" :app:assembleDebug
      - name: Verify TV APK signer
        run: |
          set -euo pipefail
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | grep 'SHA256:'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$TV_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiraculousHubTV-APK
          path: uploaded-tv-source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Prepare TV download
        run: cp "$TV_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" MiraculousHubTV.apk
      - name: Publish TV APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-build-${{ github.run_number }}
          name: MiraculousHub TV build ${{ github.run_number }}
          files: MiraculousHubTV.apk
          generate_release_notes: false
      - name: Mirror verified TV APK to website downloads
        env:
          APK_BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mh-apk-mirror
          cp "MiraculousHubTV.apk" "/tmp/mh-apk-mirror/MiraculousHubTV.apk"
          SHA256=$(sha256sum "/tmp/mh-apk-mirror/MiraculousHubTV.apk" | cut -d ' ' -f1)
          cat > "/tmp/mh-apk-mirror/tv.json" <<JSON
          {"versionCode":${APK_BUILD},"versionName":"1.0.${APK_BUILD}","url":"https://miraculoushub.co.uk/downloads/MiraculousHubTV-${APK_BUILD}.apk","sha256":"${SHA256}"}
          JSON
          git config user.name "MiraculousHub Build Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B mirror-downloads origin/main
            mkdir -p downloads
            EXISTING=$(python3 -c 'import json, pathlib; p=pathlib.Path("downloads/tv.json"); print(json.loads(p.read_text()).get("versionCode",0) if p.exists() else 0)' || echo 0)
            if [ "$EXISTING" -ge "$APK_BUILD" ]; then
              echo "Mirror already has build $EXISTING — skipping outdated build $APK_BUILD."
              exit 0
            fi
            cp "/tmp/mh-apk-mirror/MiraculousHubTV.apk" "downloads/MiraculousHubTV-${APK_BUILD}.apk"
            cp "/tmp/mh-apk-mirror/MiraculousHubTV.apk" "downloads/MiraculousHubTV.apk"
            find downloads -maxdepth 1 -type f -name 'MiraculousHubTV-*.apk' | sort -Vr | tail -n +6 | xargs -r rm --
            cp "/tmp/mh-apk-mirror/tv.json" "downloads/tv.json"
            git add -A downloads/
            git commit -m "Mirror tv APK build ${APK_BUILD} for direct website downloads"
            if git push origin HEAD:main; then
              echo "Published TV APK build ${APK_BUILD} to first-party mirror branch."
              exit 0
            fi
            sleep 3
          done
          echo "Could not update first-party APK mirror after retrying."
          exit 1
