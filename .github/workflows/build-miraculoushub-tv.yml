name: Build MiraculousHub TV APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'android-tv/**'
      - '.github/workflows/build-miraculoushub-tv.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android TV APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MiraculousHubTV-APK
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
