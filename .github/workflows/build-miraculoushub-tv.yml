name: Build MiraculousHub TV APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'android-tv/**'
      - '.github/workflows/build-miraculoushub-tv.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-tv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore permanent TV development signing certificate
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: miraculoushub-tv-signing-v1
      - name: Ensure TV signing certificate
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Fill Season 4 stills from TVmaze
        run: python3 ../scripts/prepare_s4_thumbnails.py app/src/main/assets/episodes.json
      - name: Build Android TV APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiraculousHubTV-APK
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare TV download
        run: cp app/build/outputs/apk/debug/app-debug.apk MiraculousHubTV.apk
      - name: Publish TV APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-build-${{ github.run_number }}
          name: MiraculousHub TV build ${{ github.run_number }}
          files: android-tv/MiraculousHubTV.apk
          generate_release_notes: false
