name: Check Cloudflare Worker syntax
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-uploader-worker.js'
      - '.github/workflows/check-cloudflare-worker.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Cloudflare uploader JavaScript
        run: node --check cloudflare-uploader-worker.js
