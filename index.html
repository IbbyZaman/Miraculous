<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a12">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Page not found — MiraculousHub</title>
<style>
:root{color-scheme:dark;--pink:#ff3767;--pink2:#ff6a93;--purple:#8c6dff;--text:#f7f8fc;--muted:#a6adba}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#060810;color:var(--text)}
body{min-height:100vh;display:grid;place-items:center;overflow:hidden;padding:24px;background:
 radial-gradient(900px 520px at 15% 0%,rgba(255,55,103,.16),transparent 60%),
 radial-gradient(850px 520px at 95% 100%,rgba(113,93,255,.14),transparent 60%),
 linear-gradient(180deg,#090b14,#05070c 72%)}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(28px);pointer-events:none;opacity:.7}
body:before{width:260px;height:260px;left:-70px;top:12%;background:rgba(255,55,103,.13)}
body:after{width:300px;height:300px;right:-90px;bottom:8%;background:rgba(128,94,255,.12)}
.card{position:relative;width:min(720px,100%);padding:clamp(28px,6vw,58px);border:1px solid rgba(255,255,255,.15);border-radius:34px;background:linear-gradient(180deg,rgba(27,30,43,.70),rgba(12,14,22,.82));box-shadow:0 35px 100px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.11);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);overflow:hidden}
.card:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.08),transparent 16%,transparent 82%,rgba(255,255,255,.025))}
.brand{position:relative;display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:.04em}.mark{width:42px;height:42px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,var(--pink),#d32de5);box-shadow:0 12px 30px rgba(255,55,103,.27),inset 0 1px 0 rgba(255,255,255,.32)}
.code{position:relative;margin:58px 0 0;font-size:clamp(68px,18vw,150px);line-height:.82;font-weight:950;letter-spacing:-.08em;background:linear-gradient(90deg,#fff 8%,#ff95b0 48%,#9b80ff 88%);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{position:relative;margin:24px 0 10px;font-size:clamp(28px,6vw,52px);line-height:1;letter-spacing:-.045em}p{position:relative;margin:0;max-width:600px;color:var(--muted);font-size:clamp(14px,2.3vw,18px);line-height:1.65}
.path{position:relative;margin-top:20px;padding:12px 14px;border:1px solid rgba(255,255,255,.09);border-radius:15px;background:rgba(255,255,255,.035);color:#d6dbe5;font:600 12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{position:relative;display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}.btn{min-height:48px;padding:0 18px;border-radius:16px;border:1px solid rgba(255,255,255,.12);display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;font-weight:850;background:rgba(255,255,255,.055);box-shadow:inset 0 1px 0 rgba(255,255,255,.09);transition:transform .16s ease,background .16s ease}.btn.primary{border-color:transparent;background:linear-gradient(100deg,var(--pink),#eb348c 60%,var(--purple));box-shadow:0 14px 30px rgba(255,55,103,.20),inset 0 1px 0 rgba(255,255,255,.18)}.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.10)}.btn.primary:hover{background:linear-gradient(100deg,#ff4774,#ef3c95 60%,#9578ff)}
.hint{position:relative;margin-top:22px;color:#77808f;font-size:12px}
@media(max-width:560px){body{padding:14px}.card{border-radius:26px;padding:26px 20px}.code{margin-top:44px}.actions{display:grid}.btn{width:100%}.path{font-size:11px}}
@media(prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-6K9W3X96EY"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-6K9W3X96EY');
</script>

     crossorigin="anonymous"></script>
</head>
<body>
<main class="card">
  <div class="brand"><span class="mark">M</span><span>MIRACULOUS<span style="color:#ff5f87">HUB</span></span></div>
  <div class="code">404</div>
  <h1>That page slipped into another timeline.</h1>
  <p>The address doesn’t exist, or there’s a typo in the URL. You’re still on MiraculousHub — use one of the buttons below to get back.</p>
  <div class="path" id="badPath"></div>
  <div class="actions">
    <a class="btn primary" id="homeLink" href="/">Go home</a>
    <a class="btn" id="episodesLink" href="/episodes.html?season=6">Browse episodes</a>
    <button class="btn" id="backBtn" type="button">Go back</button>
  </div>
  <div class="hint" id="routeHint"></div>
</main>
<script>
(function(){
  const parts=location.pathname.split('/').filter(Boolean);
  const onGithub=location.hostname.endsWith('.github.io');
  const base=onGithub && parts.length ? '/' + parts[0] + '/' : '/';
  const pathAfterBase=onGithub ? '/' + parts.slice(1).join('/') : location.pathname;

  document.getElementById('badPath').textContent=location.pathname + location.search;
  document.getElementById('homeLink').href=base;
  document.getElementById('episodesLink').href=base+'episodes.html';
  document.getElementById('backBtn').onclick=()=>history.length>1?history.back():location.assign(base);

  // Quietly fix a couple of common extension-less URLs.
  const clean=pathAfterBase.replace(/\/+$/,'').toLowerCase();
  const fixes={
    '/episodes':'episodes.html',
    '/episode':'episodes.html',
    '/watch':'watch.html',
    '/home':'index.html',
    '/monthly-animes':'monthly-animes.html',
    '/death-note':'death-note.html',
    '/index':'index.html'
  };
  if(fixes[clean]){
    const target=base+fixes[clean]+location.search+location.hash;
    document.getElementById('routeHint').textContent='Fixing that link…';
    setTimeout(()=>location.replace(target),350);
  } else {
    document.getElementById('routeHint').textContent='Tip: check the spelling after miraculoushub.co.uk/';
  }
})();
</script>
</body>
</html>
