<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiraculousHub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f1015;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #161822;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #232736;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #e50914;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .search-box {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      max-width: 400px;
    }

    .search-box input {
      width: 100%;
      padding: 0.6rem 1rem;
      border-radius: 6px;
      border: 1px solid #2e3346;
      background-color: #0f1015;
      color: #fff;
      outline: none;
    }

    .search-box input:focus {
      border-color: #e50914;
    }

    .search-box button {
      padding: 0.6rem 1.2rem;
      background-color: #e50914;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .search-box button:hover {
      background-color: #b80710;
    }

    main {
      flex: 1;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    /* Status & Error Alerts */
    .status-alert {
      display: none;
      background-color: #3d1a1d;
      border: 1px solid #e50914;
      color: #ffb3b6;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    /* Player Container */
    .player-container {
      display: none;
      margin-bottom: 3rem;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .player-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
    }

    .player-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .player-details {
      padding: 1.5rem;
      background-color: #161822;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .player-title {
      font-size: 1.4rem;
      font-weight: 600;
    }

    .close-btn {
      background-color: #2e3346;
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .close-btn:hover {
      background-color: #3e455e;
    }

    /* Movie Grid */
    .section-title {
      font-size: 1.3rem;
      margin-bottom: 1.5rem;
      font-weight: 600;
      color: #e0e0e0;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5rem;
    }

    .movie-card {
      background-color: #161822;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .movie-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    }

    .movie-card img {
      width: 100%;
      height: 270px;
      object-fit: cover;
      display: block;
      background-color: #232736;
    }

    .movie-info {
      padding: 0.8rem;
    }

    .movie-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 0.4rem;
      font-size: 0.8rem;
      color: #a0a0a0;
    }

    .rating {
      color: #ffd700;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      background-color: #161822;
      border-top: 1px solid #232736;
      color: #707070;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">CineStream</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search for movies...">
      <button onclick="searchMovies()">Search</button>
    </div>
  </header>

  <main>
    <div id="statusAlert" class="status-alert"></div>

    <!-- Player Container -->
    <div class="player-container" id="playerContainer">
      <div class="player-wrapper">
        <iframe id="videoPlayer" src="" allowfullscreen></iframe>
      </div>
      <div class="player-details">
        <div class="player-title" id="playerTitle">Movie Title</div>
        <button class="close-btn" onclick="closePlayer()">Close Player</button>
      </div>
    </div>

    <!-- Movies Listing -->
    <h2 class="section-title" id="gridTitle">Popular Movies</h2>
    <div class="movie-grid" id="movieGrid"></div>
  </main>

  <footer>
    &copy; CineStream. Powered by TMDB & VidSrc.
  </footer>

  <script>
    // Public TMDB API Key
    let API_KEY = '3fd2be6f0c70a2a598f084dd27581c8d';
    const BASE_URL = 'https://api.themoviedb.org/3';
    const IMAGE_URL = 'https://image.tmdb.org/t/p/w500';

    const movieGrid = document.getElementById('movieGrid');
    const searchInput = document.getElementById('searchInput');
    const gridTitle = document.getElementById('gridTitle');
    const playerContainer = document.getElementById('playerContainer');
    const videoPlayer = document.getElementById('videoPlayer');
    const playerTitle = document.getElementById('playerTitle');
    const statusAlert = document.getElementById('statusAlert');

    // Fallback list of popular movies if API is blocked by ISP or AdBlock
    const fallbackMovies = [
      { id: 550, title: "Fight Club", release_date: "1999-10-15", vote_average: 8.4, poster_path: "/pB8O2CY3kxA16P8y3S351t2A89.jpg" },
      { id: 27205, title: "Inception", release_date: "2010-07-16", vote_average: 8.4, poster_path: "/oYuLE291oAev3fRDEC1P9C3vR25.jpg" },
      { id: 157336, title: "Interstellar", release_date: "2014-11-05", vote_average: 8.4, poster_path: "/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg" },
      { id: 299536, title: "Avengers: Infinity War", release_date: "2018-04-25", vote_average: 8.3, poster_path: "/7WsyChLLEz33B3239999.jpg" },
      { id: 155, title: "The Dark Knight", release_date: "2008-07-18", vote_average: 8.5, poster_path: "/qJ2tW6WMUDux911222.jpg" }
    ];

    function showAlert(msg) {
      statusAlert.style.display = 'block';
      statusAlert.innerHTML = msg;
    }

    async function fetchPopularMovies() {
      try {
        const res = await fetch(`${BASE_URL}/movie/popular?api_key=${API_KEY}`);
        
        if (!res.ok) {
          throw new Error(`HTTP error! status: ${res.status}`);
        }
        
        const data = await res.json();
        if (data.results && data.results.length > 0) {
          displayMovies(data.results);
        } else {
          throw new Error("No results returned from API");
        }
      } catch (err) {
        console.warn('TMDB Fetch Error:', err);
        showAlert(`⚠️ <strong>Notice:</strong> Could not connect to live movie database (${err.message}). Displaying fallback catalog below. If this persists, disable your ad blocker or insert your own free TMDB API key in the code.`);
        displayMovies(fallbackMovies);
      }
    }

    async function searchMovies() {
      const query = searchInput.value.trim();
      if (!query) return;

      gridTitle.innerText = `Search Results for: "${query}"`;
      movieGrid.innerHTML = '<p>Searching...</p>';

      try {
        const res = await fetch(`${BASE_URL}/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const data = await res.json();
        if (data.results && data.results.length > 0) {
          displayMovies(data.results);
        } else {
          movieGrid.innerHTML = '<p>No movies found matching that title.</p>';
        }
      } catch (err) {
        movieGrid.innerHTML = '<p>Unable to search at the moment. Check your connection or ad blocker settings.</p>';
      }
    }

    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchMovies();
    });

    function displayMovies(movies) {
      movieGrid.innerHTML = '';
      movies.forEach(movie => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.onclick = () => playMovie(movie.id, movie.title);

        const year = movie.release_date ? movie.release_date.split('-')[0] : 'N/A';
        const rating = movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A';
        const poster = movie.poster_path ? (IMAGE_URL + movie.poster_path) : 'https://via.placeholder.com/500x750?text=No+Poster';

        card.innerHTML = `
          <img src="${poster}" alt="${movie.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/500x750?text=Image+Unavailable'">
          <div class="movie-info">
            <div class="movie-title">${movie.title}</div>
            <div class="movie-meta">
              <span>${year}</span>
              <span class="rating">★ ${rating}</span>
            </div>
          </div>
        `;
        movieGrid.appendChild(card);
      });
    }

    function playMovie(tmdbId, title) {
      // Using vidsrc.cc as the primary embed source
      const embedUrl = `https://vidsrc.cc/v2/embed/movie/${tmdbId}`;
      
      videoPlayer.src = embedUrl;
      playerTitle.innerText = title;
      playerContainer.style.display = 'block';
      playerContainer.scrollIntoView({ behavior: 'smooth' });
    }

    function closePlayer() {
      videoPlayer.src = '';
      playerContainer.style.display = 'none';
    }

    // Initial load
    fetchPopularMovies();
  </script>
</body>
</html>
