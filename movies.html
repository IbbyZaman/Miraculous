<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineStream Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f1015;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #161822;
      padding: 1rem 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #232736;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #e50914;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .nav-tabs {
      display: flex;
      gap: 0.5rem;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid #2e3346;
      color: #aaa;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    .nav-btn.active, .nav-btn:hover {
      background-color: #e50914;
      color: #fff;
      border-color: #e50914;
    }

    .header-right {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-box {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      max-width: 320px;
    }

    .search-box input, .key-box input {
      width: 100%;
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      border: 1px solid #2e3346;
      background-color: #0f1015;
      color: #fff;
      outline: none;
      font-size: 0.85rem;
    }

    .search-box input:focus, .key-box input:focus {
      border-color: #e50914;
    }

    .btn-red {
      padding: 0.5rem 1rem;
      background-color: #e50914;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .btn-red:hover {
      background-color: #b80710;
    }

    main {
      flex: 1;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .status-banner {
      display: none;
      background-color: #2b1d0c;
      border: 1px solid #d97706;
      color: #fcd34d;
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      font-size: 0.88rem;
      line-height: 1.4;
    }

    /* Player Container */
    .player-container {
      display: none;
      margin-bottom: 2.5rem;
      background-color: #161822;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .player-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      background: #000;
    }

    .player-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .player-controls {
      padding: 1.2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-between;
      align-items: center;
      background-color: #161822;
      border-top: 1px solid #232736;
    }

    .player-title {
      font-size: 1.3rem;
      font-weight: 600;
    }

    .ep-selector-group {
      display: none;
      gap: 0.5rem;
      align-items: center;
      margin-top: 0.4rem;
    }

    .ep-selector-group select {
      background: #0f1015;
      color: #fff;
      border: 1px solid #2e3346;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      outline: none;
    }

    .server-list {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .server-btn {
      background: #2e3346;
      color: #ccc;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .server-btn.active {
      background: #e50914;
      color: #fff;
    }

    .close-btn {
      background-color: #381216;
      color: #ff6b6b;
      border: 1px solid #e50914;
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Content Grid */
    .section-title {
      font-size: 1.3rem;
      margin-bottom: 1.5rem;
      font-weight: 600;
      color: #e0e0e0;
    }

    .content-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background-color: #161822;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    }

    .card img {
      width: 100%;
      height: 270px;
      object-fit: cover;
      display: block;
      background-color: #232736;
    }

    .card-info {
      padding: 0.8rem;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 0.4rem;
      font-size: 0.8rem;
      color: #a0a0a0;
    }

    .rating {
      color: #ffd700;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      background-color: #161822;
      border-top: 1px solid #232736;
      color: #707070;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">CineStream</div>
    
    <div class="nav-tabs">
      <button class="nav-btn active" id="btnMovies" onclick="switchCategory('movie')">Movies</button>
      <button class="nav-btn" id="btnTV" onclick="switchCategory('tv')">TV Shows</button>
    </div>

    <div class="header-right">
      <div class="key-box">
        <input type="text" id="tmdbKeyInput" placeholder="Optional TMDB Key...">
      </div>
      <button class="btn-red" onclick="saveApiKey()">Save Key</button>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search any movie or show...">
        <button class="btn-red" onclick="executeSearch()">Search</button>
      </div>
    </div>
  </header>

  <main>
    <div class="status-banner" id="statusBanner"></div>

    <!-- Player Container -->
    <div class="player-container" id="playerContainer">
      <div class="player-wrapper">
        <iframe id="videoPlayer" src="" allowfullscreen></iframe>
      </div>
      
      <div class="player-controls">
        <div>
          <div class="player-title" id="playerTitle">Title</div>
          <div class="ep-selector-group" id="epGroup">
            <label>Season:</label>
            <select id="seasonSelect" onchange="updateEpisodeList()"></select>
            <label>Episode:</label>
            <select id="episodeSelect" onchange="loadMediaStream()"></select>
          </div>
        </div>

        <div class="server-list">
          <span style="font-size: 0.85rem; color: #aaa;">Server:</span>
          <button class="server-btn active" id="srv1" onclick="switchServer('vidsrc_sbs', this)">Server 1 (SBS)</button>
          <button class="server-btn" id="srv2" onclick="switchServer('vidsrc_cc', this)">Server 2 (CC)</button>
          <button class="server-btn" id="srv3" onclick="switchServer('vidsrc_xyz', this)">Server 3 (XYZ)</button>
        </div>

        <button class="close-btn" onclick="closePlayer()">Close Player</button>
      </div>
    </div>

    <!-- Content Grid -->
    <h2 class="section-title" id="gridTitle">Popular Movies</h2>
    <div class="content-grid" id="contentGrid"></div>
  </main>

  <footer>
    &copy; CineStream. Powered by TMDB & VidSrc.
  </footer>

  <script>
    const BASE_URL = 'https://api.themoviedb.org/3';
    const IMAGE_URL = 'https://image.tmdb.org/t/p/w500';

    // Default public fallback key or user stored key
    let API_KEY = localStorage.getItem('user_tmdb_key') || '3fd2be6f0c70a2a598f084dd27581c8d';

    let currentCategory = 'movie';
    let activeMedia = null;
    let activeServer = 'vidsrc_sbs'; // Defaulting to vidsrc.sbs

    const contentGrid = document.getElementById('contentGrid');
    const gridTitle = document.getElementById('gridTitle');
    const searchInput = document.getElementById('searchInput');
    const tmdbKeyInput = document.getElementById('tmdbKeyInput');
    const statusBanner = document.getElementById('statusBanner');
    const playerContainer = document.getElementById('playerContainer');
    const videoPlayer = document.getElementById('videoPlayer');
    const playerTitle = document.getElementById('playerTitle');
    const epGroup = document.getElementById('epGroup');
    const seasonSelect = document.getElementById('seasonSelect');
    const episodeSelect = document.getElementById('episodeSelect');

    if (localStorage.getItem('user_tmdb_key')) {
      tmdbKeyInput.value = localStorage.getItem('user_tmdb_key');
    }

    // Fallback catalog in case public API key rate limits on load
    const fallbackCatalog = {
      movie: [
        { id: 1081003, title: "Grand Turismo / Latest Title", release_date: "2023-08-09", vote_average: 8.0, poster_path: "/538416.jpg" },
        { id: 550, title: "Fight Club", release_date: "1999-10-15", vote_average: 8.4, poster_path: "/pB8O2CY3kxA16P8y3S351t2A89.jpg" },
        { id: 27205, title: "Inception", release_date: "2010-07-16", vote_average: 8.4, poster_path: "/oYuLE291oAev3fRDEC1P9C3vR25.jpg" },
        { id: 157336, title: "Interstellar", release_date: "2014-11-05", vote_average: 8.4, poster_path: "/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg" },
        { id: 299536, title: "Avengers: Infinity War", release_date: "2018-04-25", vote_average: 8.3, poster_path: "/7WsyChLLEz33B3239999.jpg" },
        { id: 155, title: "The Dark Knight", release_date: "2008-07-18", vote_average: 8.5, poster_path: "/qJ2tW6WMUDux911222.jpg" }
      ],
      tv: [
        { id: 1396, name: "Breaking Bad", first_air_date: "2008-01-20", vote_average: 8.9, poster_path: "/zt2A1f133A89f36pP.jpg" },
        { id: 1399, name: "Game of Thrones", first_air_date: "2011-04-17", vote_average: 8.4, poster_path: "/1XS1oqL89f36.jpg" },
        { id: 66732, name: "Stranger Things", first_air_date: "2016-07-15", vote_average: 8.6, poster_path: "/49W146316281.jpg" }
      ]
    };

    function saveApiKey() {
      const val = tmdbKeyInput.value.trim();
      if (val) {
        localStorage.setItem('user_tmdb_key', val);
        API_KEY = val;
        statusBanner.style.display = 'none';
        alert("Personal TMDB Key saved! Reloading catalog...");
        fetchPopular();
      }
    }

    function switchCategory(cat) {
      currentCategory = cat;
      document.getElementById('btnMovies').classList.toggle('active', cat === 'movie');
      document.getElementById('btnTV').classList.toggle('active', cat === 'tv');
      gridTitle.innerText = cat === 'movie' ? 'Popular Movies' : 'Popular TV Shows';
      fetchPopular();
    }

    async function fetchPopular() {
      contentGrid.innerHTML = '<p>Loading latest titles...</p>';
      try {
        const res = await fetch(`${BASE_URL}/${currentCategory}/popular?api_key=${API_KEY}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const data = await res.json();
        if (data.results && data.results.length > 0) {
          statusBanner.style.display = 'none';
          displayGrid(data.results);
        } else {
          throw new Error("Empty dataset");
        }
      } catch (err) {
        console.warn('API fetch warning:', err);
        statusBanner.style.display = 'block';
        statusBanner.innerHTML = `⚠️ <strong>Notice:</strong> TMDB shared API key is currently busy or rate-limited. Enter your own free personal key above to search all titles, or click any title below.`;
        displayGrid(fallbackCatalog[currentCategory]);
      }
    }

    async function executeSearch() {
      const query = searchInput.value.trim();
      if (!query) return;

      gridTitle.innerText = `Search Results for: "${query}"`;
      contentGrid.innerHTML = '<p>Searching TMDB database...</p>';

      try {
        const res = await fetch(`${BASE_URL}/search/${currentCategory}?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        if (!data.results || data.results.length === 0) {
          contentGrid.innerHTML = '<p>No results found for that title.</p>';
        } else {
          displayGrid(data.results);
        }
      } catch (err) {
        contentGrid.innerHTML = '<p>Search rate-limited. Enter a free personal TMDB key in the header to search any title live.</p>';
      }
    }

    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') executeSearch();
    });

    function displayGrid(items) {
      contentGrid.innerHTML = '';
      items.forEach(item => {
        const title = item.title || item.name;
        const date = item.release_date || item.first_air_date || '';
        const year = date ? date.split('-')[0] : 'N/A';
        const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
        const poster = item.poster_path ? (IMAGE_URL + item.poster_path) : 'https://via.placeholder.com/500x750?text=No+Poster';

        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => selectMedia(item);

        card.innerHTML = `
          <img src="${poster}" alt="${title}" loading="lazy" onerror="this.src='https://via.placeholder.com/500x750?text=No+Poster'">
          <div class="card-info">
            <div class="card-title">${title}</div>
            <div class="card-meta">
              <span>${year}</span>
              <span class="rating">★ ${rating}</span>
            </div>
          </div>
        `;
        contentGrid.appendChild(card);
      });
    }

    async function selectMedia(item) {
      activeMedia = item;
      const title = item.title || item.name;
      playerTitle.innerText = title;

      if (currentCategory === 'tv') {
        epGroup.style.display = 'flex';
        await loadTVSeasons(item.id);
      } else {
        epGroup.style.display = 'none';
        loadMediaStream();
      }

      playerContainer.style.display = 'block';
      playerContainer.scrollIntoView({ behavior: 'smooth' });
    }

    async function loadTVSeasons(tvId) {
      seasonSelect.innerHTML = '';
      try {
        const res = await fetch(`${BASE_URL}/tv/${tvId}?api_key=${API_KEY}`);
        const data = await res.json();

        if (data.seasons && data.seasons.length > 0) {
          data.seasons.forEach(season => {
            if (season.season_number > 0) {
              const opt = document.createElement('option');
              opt.value = season.season_number;
              opt.innerText = `Season ${season.season_number}`;
              seasonSelect.appendChild(opt);
            }
          });
        } else {
          throw new Error();
        }
        updateEpisodeList();
      } catch (err) {
        seasonSelect.innerHTML = '<option value="1">Season 1</option><option value="2">Season 2</option>';
        updateEpisodeList();
      }
    }

    async function updateEpisodeList() {
      episodeSelect.innerHTML = '';
      const seasonNum = seasonSelect.value || 1;
      try {
        const res = await fetch(`${BASE_URL}/tv/${activeMedia.id}/season/${seasonNum}?api_key=${API_KEY}`);
        const data = await res.json();

        data.episodes.forEach(ep => {
          const opt = document.createElement('option');
          opt.value = ep.episode_number;
          opt.innerText = `Ep ${ep.episode_number}: ${ep.name}`;
          episodeSelect.appendChild(opt);
        });
      } catch (err) {
        for (let i = 1; i <= 20; i++) {
          const opt = document.createElement('option');
          opt.value = i;
          opt.innerText = `Episode ${i}`;
          episodeSelect.appendChild(opt);
        }
      }
      loadMediaStream();
    }

    function switchServer(server, btnEl) {
      activeServer = server;
      document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');
      loadMediaStream();
    }

    function loadMediaStream() {
      if (!activeMedia) return;

      const tmdbId = activeMedia.id;
      const season = seasonSelect.value || 1;
      const episode = episodeSelect.value || 1;
      let url = '';

      // Primary server uses vidsrc.sbs
      if (currentCategory === 'movie') {
        if (activeServer === 'vidsrc_sbs') url = `https://vidsrc.sbs/embed/movie/${tmdbId}`;
        else if (activeServer === 'vidsrc_cc') url = `https://vidsrc.cc/v2/embed/movie/${tmdbId}`;
        else if (activeServer === 'vidsrc_xyz') url = `https://vidsrc.xyz/embed/movie?tmdb=${tmdbId}`;
      } else {
        if (activeServer === 'vidsrc_sbs') url = `https://vidsrc.sbs/embed/tv/${tmdbId}/${season}/${episode}`;
        else if (activeServer === 'vidsrc_cc') url = `https://vidsrc.cc/v2/embed/tv/${tmdbId}/${season}/${episode}`;
        else if (activeServer === 'vidsrc_xyz') url = `https://vidsrc.xyz/embed/tv?tmdb=${tmdbId}&season=${season}&episode=${episode}`;
      }

      videoPlayer.src = url;
    }

    function closePlayer() {
      videoPlayer.src = '';
      playerContainer.style.display = 'none';
      activeMedia = null;
    }

    // Initial load
    fetchPopular();
  </script>
</body>
</html>
