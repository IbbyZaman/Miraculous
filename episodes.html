  <button>FRANÇAIS</button>

  <button>DEUTSCH</button>
  <button>ITALIANO</button>
  <button>PORTUGUÊS</button>

<script src="data.js"></script>
<script src="firebase.js"></script>
<script src="common.js"></script>
<script src="motion.js?v=hybrid-glass-1"></script>
<script>
let season="0", mode="all", q="";
const tabs=document.querySelector("#seasonTabs");
const glider=document.querySelector("#seasonGlider");
const grid=document.querySelector("#episodeGrid");
const seasonOrder=["0","1","2","3","4","5","6","specials"];

const seasonButtons=[
  ["0","All"],
  ["1","Season 1"],
  ["2","Season 2"],
  ["3","Season 3"],
  ["4","Season 4"],
  ["5","Season 5"],
  ["6","Season 6"],
  ["specials","Specials"]
];

tabs.insertAdjacentHTML("beforeend",seasonButtons.map(([value,label],i)=>
  `<button class="season-tab ${i===0?"active":""}" data-season="${value}">${label}</button>`
).join(""));

function moveSeasonGlider(button, smooth=true){
  if(!button)return;
  if(!smooth) glider.style.transition="none";
  glider.style.transform=`translate3d(${button.offsetLeft}px,0,0)`;
  glider.style.width=`${button.offsetWidth}px`;
  if(!smooth){
    glider.getBoundingClientRect();
    glider.style.removeProperty("transition");
  }
}

function currentSeasonButton(){
  return tabs.querySelector(`.season-tab[data-season="${season}"]`);
}

requestAnimationFrame(()=>moveSeasonGlider(currentSeasonButton(),false));
window.addEventListener("resize",()=>moveSeasonGlider(currentSeasonButton(),false));

function getEpisodes(){
  let arr=season==="specials"
    ? MH_SPECIALS.map((t,i)=>({
        season:"Special",
        episode:i+1,
        title:t,
        code:`SPECIAL ${i+1}`,
        special:true,
        videoPath:t==="London: At the Edge of Time"?"/video/london":""
      }))
    : MH_EPISODES.filter(e=>season==="0"||e.season==season);

  // Kept compatible with the existing data: "sub" becomes useful
  // automatically when an episode later receives a subtitle flag.
  if(mode==="sub"){
    const flagged=arr.filter(e=>e.subtitled||e.subtitles);
    if(flagged.length) arr=flagged;
  }

  if(mode==="new") arr=arr.filter(e=>e.new);
  if(q) arr=arr.filter(e=>`${e.title} ${e.code}`.toLowerCase().includes(q));
  return arr;
}

function render(){
  const arr=getEpisodes();

  grid.innerHTML=arr.length
    ? arr.map(e=>{
        const href=e.special
          ? (e.videoPath?`watch.html?special=${e.episode}`:"#")
          : `watch.html?season=${e.season}&episode=${e.episode}`;

        return `
          <a class="card" href="${href}">
            <div class="art">
              ${e.new?'<span class="new">NEW</span>':''}
              <span class="epno">${e.special?e.code:`SEASON ${e.season} · EPISODE ${e.episode}`}</span>
            </div>
            <div class="card-info">
              <h3>${e.title}</h3>
              <p>${e.code}</p>
            </div>
          </a>`;
      }).join("")
    : '<div class="empty">No episodes match your search.</div>';
}

function glideSeason(nextSeason){
  if(nextSeason===season)return;

  const oldIndex=seasonOrder.indexOf(String(season));
  const newIndex=seasonOrder.indexOf(String(nextSeason));
  const direction=newIndex>=oldIndex?"forward":"back";
  const leaveClass=direction==="forward"?"grid-leave-forward":"grid-leave-back";
  const enterClass=direction==="forward"?"grid-enter-forward":"grid-enter-back";

  grid.classList.remove("grid-enter-forward","grid-enter-back");
  grid.classList.add(leaveClass);

  setTimeout(()=>{
    season=String(nextSeason);

    tabs.querySelectorAll(".season-tab").forEach(x=>
      x.classList.toggle("active",x.dataset.season===season)
    );

    const button=currentSeasonButton();
    moveSeasonGlider(button,true);
    if(button){
      const br=button.getBoundingClientRect();
      const tr=tabs.getBoundingClientRect();
      if(br.left<tr.left || br.right>tr.right){
        button.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
      }
    }

    render();

    grid.classList.remove("grid-leave-forward","grid-leave-back");
    grid.classList.add(enterClass);
    setTimeout(()=>grid.classList.remove(enterClass),420);
  },145);
}

tabs.addEventListener("click",e=>{
  const button=e.target.closest(".season-tab");
  if(!button)return;
  glideSeason(button.dataset.season);
});

document.querySelectorAll(".filter").forEach(button=>{
  button.onclick=()=>{
    document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
    button.classList.add("active");
    mode=button.dataset.filter;
    render();
    grid.classList.remove("grid-enter-forward","grid-enter-back");
    void grid.offsetWidth;
    grid.classList.add("grid-enter-forward");
    setTimeout(()=>grid.classList.remove("grid-enter-forward"),420);
  };
});

document.querySelector("#episodeSearch").oninput=e=>{
  q=e.target.value.toLowerCase();
  render();
};

render();
</script>
</body>
