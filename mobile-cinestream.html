<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Streaming App</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f1014;
            --surface-color: #181a20;
            --surface-hover: #22252e;
            --accent-color: #e50914;
            --text-main: #ffffff;
            --text-muted: #9e9e9e;
            --border-color: #2a2d37;
            --mobile-width: 414px;
            --mobile-height: 896px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #050505;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
        }

        /* Mobile Device Frame */
        .mobile-container {
            width: 100%;
            max-width: var(--mobile-width);
            height: var(--mobile-height);
            background-color: var(--bg-color);
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 12px #262626;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Notch / Status Bar */
        .status-bar {
            height: 44px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            font-size: 13px;
            font-weight: 600;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(15,16,20,0.8), transparent);
            pointer-events: none;
        }

        .notch {
            width: 120px;
            height: 25px;
            background-color: #262626;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 101;
        }

        /* Content Views */
        .screen-container {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 70px;
            scrollbar-width: none;
        }

        .screen-container::-webkit-scrollbar {
            display: none;
        }

        .screen {
            display: none;
            padding-top: 44px;
            animation: fadeIn 0.25s ease-in-out;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hero Banner */
        .hero {
            position: relative;
            height: 380px;
            width: 100%;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding: 20px;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, var(--bg-color) 10%, transparent 70%);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            width: 100%;
        }

        .hero-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .hero-tags {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .hero-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            border: none;
            outline: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.15s ease, background-color 0.15s ease;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: var(--text-main);
            flex: 1;
            justify-content: center;
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            backdrop-filter: blur(10px);
        }

        /* Section Lists */
        .section {
            margin-top: 24px;
            padding: 0 16px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
        }

        .horizontal-row {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none;
        }

        .horizontal-row::-webkit-scrollbar {
            display: none;
        }

        .media-card {
            flex: 0 0 125px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .media-card:active {
            transform: scale(0.95);
        }

        .media-poster {
            width: 125px;
            height: 185px;
            border-radius: 12px;
            object-fit: cover;
            background-color: var(--surface-color);
            margin-bottom: 6px;
        }

        .media-card-title {
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .media-rating {
            font-size: 11px;
            color: #ffd700;
            margin-top: 2px;
        }

        /* Detail Screen */
        .detail-header {
            height: 300px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .back-btn {
            position: absolute;
            top: 50px;
            left: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }

        .detail-info {
            padding: 20px 16px;
        }

        .detail-description {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-top: 12px;
        }

        /* Profile Screen */
        .profile-header {
            text-align: center;
            padding: 24px 16px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-color), #80050b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 12px;
        }

        .menu-list {
            list-style: none;
            padding: 0 16px;
        }

        .menu-item {
            padding: 16px;
            background-color: var(--surface-color);
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            cursor: pointer;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background-color: rgba(24, 26, 32, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 90;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 10px;
            cursor: pointer;
            width: 25%;
            transition: color 0.15s ease;
        }

        .nav-item i {
            font-size: 18px;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        /* Fullscreen HTML5 Video Player Overlay */
        .player-modal {
            position: absolute;
            inset: 0;
            background: #000;
            z-index: 200;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .player-modal.active {
            display: flex;
        }

        .close-player {
            position: absolute;
            top: 50px;
            right: 20px;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 210;
            background: rgba(0,0,0,0.6);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- Status Bar & Notch -->
        <div class="notch"></div>
        <div class="status-bar">
            <span>9:41</span>
            <div>
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi" style="margin: 0 4px;"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <!-- Main Screen Container -->
        <div class="screen-container">
            
            <!-- HOME SCREEN -->
            <div id="screen-home" class="screen active">
                <div id="hero-banner" class="hero">
                    <div class="hero-overlay"></div>
                    <div class="hero-content">
                        <h1 id="hero-title" class="hero-title">Loading...</h1>
                        <div id="hero-tags" class="hero-tags">
                            <span>Action</span> • <span>Sci-Fi</span> • <span>2024</span>
                        </div>
                        <div class="hero-buttons">
                            <button class="btn btn-primary" onclick="openPlayer()">
                                <i class="fa-solid fa-play"></i> Play
                            </button>
                            <button class="btn btn-secondary" onclick="openDetailCurrentHero()">
                                <i class="fa-solid fa-circle-info"></i> Info
                            </button>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header">
                        <h2 class="section-title">Trending Now</h2>
                    </div>
                    <div class="horizontal-row" id="trending-row"></div>
                </div>

                <div class="section">
                    <div class="section-header">
                        <h2 class="section-title">Popular Movies</h2>
                    </div>
                    <div class="horizontal-row" id="popular-row"></div>
                </div>
            </div>

            <!-- SEARCH SCREEN -->
            <div id="screen-search" class="screen">
                <div style="padding: 16px;">
                    <div style="background: var(--surface-color); padding: 10px 16px; border-radius: 12px; display: flex; align-items: center; gap: 10px;">
                        <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
                        <input type="text" id="search-input" placeholder="Search movies, shows..." oninput="handleSearch(this.value)" style="background: transparent; border: none; outline: none; color: white; width: 100%;">
                    </div>
                    <div class="section" style="padding: 0; margin-top: 20px;">
                        <h3 style="margin-bottom: 12px;" id="search-heading">Top Searches</h3>
                        <div id="search-results" style="display: flex; flex-direction: column; gap: 10px;"></div>
                    </div>
                </div>
            </div>

            <!-- DETAIL SCREEN -->
            <div id="screen-detail" class="screen">
                <div id="detail-backdrop" class="detail-header">
                    <div class="back-btn" onclick="switchScreen('home')">
                        <i class="fa-solid fa-arrow-left"></i>
                    </div>
                </div>
                <div class="detail-info">
                    <h1 id="detail-title" class="hero-title">Movie Title</h1>
                    <div id="detail-tags" class="hero-tags" style="margin-top: 6px;">
                        <span id="detail-year">2024</span> • <span id="detail-rating">⭐ 8.5</span>
                    </div>
                    <button class="btn btn-primary" style="width: 100%; margin: 16px 0;" onclick="openPlayer()">
                        <i class="fa-solid fa-play"></i> Play Movie
                    </button>
                    <h3 style="font-size: 16px;">Overview</h3>
                    <p id="detail-overview" class="detail-description">Movie synopsis goes here...</p>
                </div>
            </div>

            <!-- PROFILE SCREEN -->
            <div id="screen-profile" class="screen">
                <div class="profile-header">
                    <div class="profile-avatar">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <h2>Alex Johnson</h2>
                    <p style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">Premium Member</p>
                </div>
                <ul class="menu-list">
                    <li class="menu-item">
                        <span><i class="fa-solid fa-bookmark" style="margin-right: 10px;"></i> Watchlist</span>
                        <i class="fa-solid fa-chevron-right" style="color: var(--text-muted);"></i>
                    </li>
                    <li class="menu-item">
                        <span><i class="fa-solid fa-clock-rotate-left" style="margin-right: 10px;"></i> History</span>
                        <i class="fa-solid fa-chevron-right" style="color: var(--text-muted);"></i>
                    </li>
                    <li class="menu-item">
                        <span><i class="fa-solid fa-gear" style="margin-right: 10px;"></i> Settings</span>
                        <i class="fa-solid fa-chevron-right" style="color: var(--text-muted);"></i>
                    </li>
                    <li class="menu-item" style="color: var(--accent-color);">
                        <span><i class="fa-solid fa-right-from-bracket" style="margin-right: 10px;"></i> Log Out</span>
                    </li>
                </ul>
            </div>

        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchScreen('home', this)">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </div>
            <div class="nav-item" onclick="switchScreen('search', this)">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>Search</span>
            </div>
            <div class="nav-item" onclick="switchScreen('profile', this)">
                <i class="fa-solid fa-user"></i>
                <span>Profile</span>
            </div>
        </div>

        <!-- Video Player Modal Overlay -->
        <div id="player-modal" class="player-modal">
            <div class="close-player" onclick="closePlayer()">
                <i class="fa-solid fa-xmark"></i>
            </div>
            <!-- Live Open-Source Sample Video Stream -->
            <video id="active-video-player" controls preload="metadata">
                <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" type="video/mp4">
                Your browser does not support HTML5 video.
            </video>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        const TMDB_API_KEY = "3fd2be6f0cd05663659781c6d643114b";
        const BASE_IMAGE_URL = "https://image.tmdb.org/t/p/w500";
        let currentHeroMovie = null;
        let allMoviesCache = [];

        // View Navigation Handler
        function switchScreen(screenId, navElement = null) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(`screen-${screenId}`);
            if (target) target.classList.add('active');

            if (navElement) {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                navElement.classList.add('active');
            }
        }

        // Fetch Movies from TMDB API
        async function fetchMovies() {
            try {
                const response = await fetch(`https://api.themoviedb.org/3/trending/movie/week?api_key=${TMDB_API_KEY}`);
                if (!response.ok) throw new Error("API request failed");
                
                const data = await response.json();
                allMoviesCache = data.results;

                if (allMoviesCache.length > 0) {
                    setupHeroBanner(allMoviesCache[0]);
                    renderRow('trending-row', allMoviesCache.slice(1, 10));
                    renderRow('popular-row', allMoviesCache.slice(10, 18));
                    renderSearchResults(allMoviesCache.slice(0, 5));
                }
            } catch (err) {
                console.warn("Using fallback local data:", err);
                loadFallbackMovies();
            }
        }

        // Setup Hero Banner
        function setupHeroBanner(movie) {
            currentHeroMovie = movie;
            const heroEl = document.getElementById('hero-banner');
            const backdropPath = movie.backdrop_path ? `${BASE_IMAGE_URL}${movie.backdrop_path}` : '';
            heroEl.style.backgroundImage = `url('${backdropPath}')`;
            document.getElementById('hero-title').innerText = movie.title || movie.name;
        }

        // Render Cards in Horizontal Row
        function renderRow(containerId, movies) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            movies.forEach(movie => {
                if (!movie.poster_path) return;
                
                const card = document.createElement('div');
                card.className = 'media-card';
                card.onclick = () => openDetail(movie);

                card.innerHTML = `
                    <img class="media-poster" src="${BASE_IMAGE_URL}${movie.poster_path}" alt="${movie.title}" loading="lazy">
                    <div class="media-card-title">${movie.title}</div>
                    <div class="media-rating"><i class="fa-solid fa-star"></i> ${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A'}</div>
                `;
                container.appendChild(card);
            });
        }

        // Dynamic Search Handler
        function handleSearch(query) {
            const heading = document.getElementById('search-heading');
            if (!query.trim()) {
                heading.innerText = 'Top Searches';
                renderSearchResults(allMoviesCache.slice(0, 5));
                return;
            }

            heading.innerText = 'Search Results';
            const filtered = allMoviesCache.filter(m => 
                (m.title || '').toLowerCase().includes(query.toLowerCase())
            );
            renderSearchResults(filtered);
        }

        // Render Search Results List
        function renderSearchResults(movies) {
            const container = document.getElementById('search-results');
            container.innerHTML = '';

            if (movies.length === 0) {
                container.innerHTML = `<div style="color:var(--text-muted); padding:10px;">No movies found.</div>`;
                return;
            }

            movies.forEach(movie => {
                const item = document.createElement('div');
                item.className = 'menu-item';
                item.onclick = () => openDetail(movie);
                item.innerHTML = `
                    <div style="display:flex; align-items:center; gap:12px;">
                        <img src="${BASE_IMAGE_URL}${movie.poster_path}" style="width:40px; height:55px; border-radius:6px; object-fit:cover;">
                        <div>
                            <div style="font-weight:600;">${movie.title}</div>
                            <div style="font-size:12px; color:var(--text-muted);">${movie.release_date ? movie.release_date.split('-')[0] : ''}</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right" style="color: var(--text-muted);"></i>
                `;
                container.appendChild(item);
            });
        }

        // Open Detail View
        function openDetail(movie) {
            currentHeroMovie = movie;
            document.getElementById('detail-backdrop').style.backgroundImage = `url('${BASE_IMAGE_URL}${movie.backdrop_path || movie.poster_path}')`;
            document.getElementById('detail-title').innerText = movie.title;
            document.getElementById('detail-overview').innerText = movie.overview || "No description available.";
            document.getElementById('detail-year').innerText = movie.release_date ? movie.release_date.split('-')[0] : 'N/A';
            document.getElementById('detail-rating').innerText = `⭐ ${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A'}`;
            
            switchScreen('detail');
        }

        function openDetailCurrentHero() {
            if (currentHeroMovie) openDetail(currentHeroMovie);
        }

        // Video Player Controls
        function openPlayer() {
            const modal = document.getElementById('player-modal');
            const player = document.getElementById('active-video-player');
            modal.classList.add('active');
            player.play().catch(e => console.log("Autoplay blocked:", e));
        }

        function closePlayer() {
            const modal = document.getElementById('player-modal');
            const player = document.getElementById('active-video-player');
            player.pause();
            modal.classList.remove('active');
        }

        // Fallback Movies List
        function loadFallbackMovies() {
            const sampleMovies = [
                {
                    id: "454639",
                    title: "Dune: Part Two",
                    poster_path: "/1pdfLPoLViEFiZjhv2kgCMm9Re.jpg",
                    backdrop_path: "/xOMo8BRK7PfcJv9JCnx7s52B3gY.jpg",
                    overview: "Paul Atreides unites with Chani and the Fremen while seeking revenge against the conspirators who destroyed his family.",
                    release_date: "2024-02-27",
                    vote_average: 8.3
                },
                {
                    id: "693134",
                    title: "Godzilla x Kong",
                    poster_path: "/z121Wiqw8g9HGvP3jGl1St0jWj7.jpg",
                    backdrop_path: "/1XwY1A4Tep80d2p81y294c.jpg",
                    overview: "Two ancient titans clash in an epic battle while humans uncover their intertwined origins.",
                    release_date: "2024-03-27",
                    vote_average: 7.2
                }
            ];

            allMoviesCache = sampleMovies;
            setupHeroBanner(sampleMovies[0]);
            renderRow('trending-row', sampleMovies);
            renderRow('popular-row', sampleMovies);
            renderSearchResults(sampleMovies);
        }

        // Initialize App
        fetchMovies();
    </script>
</body>
</html>
