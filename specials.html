<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Favicon / Paw Print Icon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6K9W3X96EY"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miraculous Hub - Special Episodes</title>

    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #08090c;
            --card-bg: rgba(22, 24, 33, 0.7);
            --card-border: rgba(255, 23, 68, 0.15);
            --ladybug-red: #ff1744;
            --ladybug-glow: rgba(255, 23, 68, 0.35);
            --catnoir-green: #00e676;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 23, 68, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 230, 118, 0.03) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- Header / Sticky Navbar --- */
        header {
            background: rgba(8, 9, 12, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--ladybug-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px var(--ladybug-glow);
        }

        .logo-icon i {
            color: #fff;
            font-size: 16px;
        }

        .logo-text {
            color: #fff;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo-text span {
            color: var(--ladybug-red);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        nav a:hover, nav a.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
        }

        nav a.active {
            color: var(--ladybug-red);
            border: 1px solid rgba(255, 23, 68, 0.3);
            box-shadow: 0 0 12px rgba(255, 23, 68, 0.2);
        }

        /* --- Layout Container --- */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 30px 20px;
            width: 100%;
            flex: 1;
        }

        /* --- Player Container --- */
        .video-player-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--card-border);
            transition: all 0.4s ease;
        }

        .video-player-container.active-playing {
            border-color: var(--ladybug-red);
            box-shadow: 0 0 35px var(--ladybug-glow), 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 16px;
            background: #000;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .video-wrapper video, .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            gap: 15px;
            background: radial-gradient(circle, rgba(22,24,33,1) 0%, rgba(8,9,12,1) 100%);
        }

        .player-placeholder i {
            font-size: 48px;
            color: var(--ladybug-red);
        }

        /* --- Player Dashboard --- */
        .player-dashboard {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 20px;
        }

        .player-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .video-player-container.active-playing .player-status-badge {
            background: rgba(0, 230, 118, 0.1);
            color: var(--catnoir-green);
            border-color: rgba(0, 230, 118, 0.3);
        }

        .video-info h2 {
            color: #fff;
            font-size: 24px;
            font-weight: 800;
        }

        .video-info p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
            margin-top: 4px;
        }

        /* --- Section Titles --- */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 0 20px 0;
        }

        .section-title {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 22px;
            background: var(--ladybug-red);
            border-radius: 4px;
            box-shadow: 0 0 10px var(--ladybug-red);
        }

        /* --- Grid & Episode Cards --- */
        .episode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .episode-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .episode-card:hover {
            transform: translateY(-6px);
            border-color: var(--ladybug-red);
            box-shadow: 0 12px 25px rgba(255, 23, 68, 0.25);
        }

        .episode-card.is-playing {
            border-color: var(--catnoir-green);
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.3);
            background: rgba(22, 33, 26, 0.8);
        }

        .thumbnail-box {
            width: 100%;
            height: 140px;
            background-color: #12141d;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thumbnail-box::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 40%, rgba(8, 9, 12, 0.8) 100%);
            transition: background 0.3s ease;
        }

        .episode-card:hover .thumbnail-box::before {
            background: rgba(8, 9, 12, 0.6);
        }

        .play-overlay {
            position: absolute;
            width: 42px;
            height: 42px;
            background: var(--ladybug-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 15px;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s ease;
            box-shadow: 0 0 15px var(--ladybug-glow);
            z-index: 2;
        }

        .episode-card:hover .play-overlay {
            opacity: 1;
            transform: scale(1);
        }

        .episode-card.is-playing .play-overlay {
            opacity: 1;
            background: var(--catnoir-green);
            color: #000;
            transform: scale(1);
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.5);
        }

        .episode-details {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .episode-number {
            font-size: 11px;
            color: var(--ladybug-red);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .episode-card.is-playing .episode-number {
            color: var(--catnoir-green);
        }

        .episode-title {
            font-size: 15px;
            color: #fff;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        footer {
            background: #050608;
            text-align: center;
            padding: 30px;
            font-size: 14px;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 60px;
        }

        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
                flex-direction: column;
                gap: 12px;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .container {
                padding: 15px 10px;
            }

            .video-player-container {
                padding: 12px;
            }

            .video-info h2 {
                font-size: 18px;
            }

            .episode-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 12px;
            }

            .thumbnail-box {
                height: 100px;
            }
        }
    </style>
</head>
<body>

    <!-- Modern Sticky Navbar -->
    <header>
        <a href="index.html" class="logo">
            <div class="logo-icon"><i class="fa-solid fa-bug"></i></div>
            <div class="logo-text">MIRACULOUS<span>HUB</span></div>
        </a>
        <nav>
            <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
            <a href="season-4.html" class="nav-link">Season 4</a>
            <a href="season-5.html">Season 5</a>
            <a href="season-6.html">Season 6</a>
            <a href="specials.html" class="active">Specials</a>
            <a href="announcements.html">Announcements</a>
        </nav>
    </header>

    <div class="container">
        <!-- Stream Player Container Dashboard -->
        <div class="video-player-container" id="player-container">
            <div class="video-wrapper" id="video-wrapper-target">
                <div class="player-placeholder">
                    <i class="fa-solid fa-film"></i>
                    <p>Select a special episode below to start streaming</p>
                </div>
            </div>
            
            <div class="player-dashboard">
                <div class="player-status-badge" id="status-badge"><i class="fa-solid fa-circle"></i> Ready</div>
                <div class="video-info">
                    <h2 id="current-title">Select a Special</h2>
                    <p id="current-description">Choose a Special Episode from the list to launch video playback.</p>
                </div>
            </div>
        </div>

        <!-- Section Title & Grid -->
        <div class="section-header">
            <h3 class="section-title">Special Episodes</h3>
        </div>

        <div class="episode-grid" id="specials-container">
            <!-- Dynamic Specials Go Here -->
        </div>
    </div>

    <footer>
        &copy; 2026 Miraculous Hub. For personal configurations.
    </footer>

    <script>
        const specialsData = [
            { id: "SP01", title: "New York: United Heroez", url: "https://drive.google.com/file/d/113VQeoiZfg0oekuH4vWFe-sMtDYvpbV7/view?usp=sharing" },
            { id: "SP02", title: "Shanghai: The Legend of Ladydragon", url: "https://drive.google.com/file/d/1xMI7qCDUb_KbIKBwp6GOGYjCNZfaRpUh/view?usp=sharing" },
            { id: "SP03", title: "The Awakening", url: "https://drive.google.com/file/d/1L72Jifoz3imIAu4o8JpG8AM2_-W5x7Mq/view?usp=sharing" },
            { id: "SP04", title: "Paris: Tales of Shadybug & Claw Noir", url: "https://drive.google.com/file/d/1iwv5Z6NzPrQ5uHeuGZGZpleFPra-3ab3/view?usp=sharing" },
            { id: "SP05", title: "London: At the Edge of Time", url: "https://drive.google.com/file/d/1jl537E8jZZ7gA8UpjpbjRyID1CEquCxb/view?usp=sharing" },
            { id: "SP06", title: "Tokyo: Stellar Force", url: "https://drive.google.com/file/d/1BIS_0awO77S-of-P_MZ6tfhi3mZDaGP1/view?usp=sharing" }
        ];

        const specialsContainer = document.getElementById('specials-container');

        function buildSpecialsGrid() {
            specialsData.forEach((ep) => {
                const card = document.createElement('div');
                card.className = 'episode-card';
                card.id = `card-${ep.id}`;
                
                const thumbnailUrl = `thumbnails/${ep.id}.jpg`;
                
                card.innerHTML = `
                    <div class="thumbnail-box" style="background-image: url('${thumbnailUrl}');">
                        <div class="play-overlay"><i class="fa-solid fa-play"></i></div>
                    </div>
                    <div class="episode-details">
                        <div class="episode-number">Special Event</div>
                        <div class="episode-title">${ep.title}</div>
                    </div>
                `;
                
                card.onclick = () => {
                    changeVideo(ep.url, `Special: ${ep.title}`, ep.id);
                    saveProgress(`Special: ${ep.title}`, 'specials.html', thumbnailUrl);
                };
                specialsContainer.appendChild(card);
            });
        }

        function changeVideo(videoSrc, fullTitle, activeId) {
            const wrapper = document.getElementById('video-wrapper-target');
            const playerContainer = document.getElementById('player-container');
            const statusBadge = document.getElementById('status-badge');
            const titleElement = document.getElementById('current-title');
            const descElement = document.getElementById('current-description');

            // Highlight active special card
            document.querySelectorAll('.episode-card').forEach(card => card.classList.remove('is-playing'));
            const activeCard = document.getElementById(`card-${activeId}`);
            if(activeCard) activeCard.classList.add('is-playing');

            playerContainer.classList.add('active-playing');
            statusBadge.innerHTML = `<i class="fa-solid fa-signal"></i> Streaming Now`;
            titleElement.textContent = fullTitle;
            descElement.textContent = "Enjoy streaming this special episode on Miraculous Hub.";

            // Format Drive URL properly for playback
            let embedUrl = videoSrc.replace('/view?usp=sharing', '/preview');
            if(!embedUrl.includes('/preview') && embedUrl.includes('/view')) {
                 embedUrl = embedUrl.split('/view')[0] + '/preview';
            }
            
            wrapper.innerHTML = `<iframe src="${embedUrl}" sandbox="allow-scripts allow-same-origin allow-presentation" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
            
            // Smooth scroll to video player
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function saveProgress(title, page, thumbnail) {
            const data = { title, page, thumbnail };
            localStorage.setItem('miraculous_last_watched', JSON.stringify(data));
        }

        window.addEventListener('DOMContentLoaded', () => {
            buildSpecialsGrid();
        });
    </script>
</body>
</html>
