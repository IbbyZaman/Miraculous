<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineStream Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f1015;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #161822;
      padding: 1rem 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #232736;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #e50914;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .nav-tabs {
      display: flex;
      gap: 0.5rem;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid #2e3346;
      color: #aaa;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    .nav-btn.active, .nav-btn:hover {
      background-color: #e50914;
      color: #fff;
      border-color: #e50914;
    }

    .header-right {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-box {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      max-width: 380px;
    }

    .search-box input {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      border: 1px solid #2e3346;
      background-color: #0f1015;
      color: #fff;
      outline: none;
      font-size: 0.9rem;
    }

    .search-box input:focus {
      border-color: #e50914;
    }

    .btn-red {
      padding: 0.6rem 1.2rem;
      background-color: #e50914;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .btn-red:hover {
      background-color: #b80710;
    }

    main {
      flex: 1;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    /* Player Container */
    .player-container {
      display: none;
      margin-bottom: 2.5rem;
      background-color: #161822;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .player-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      background: #000;
    }

    .player-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .player-controls {
      padding: 1.2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-between;
      align-items: center;
      background-color: #161822;
      border-top: 1px solid #232736;
    }

    .player-title {
      font-size: 1.3rem;
      font-weight: 600;
    }

    .ep-selector-group {
      display: none;
      gap: 0.5rem;
      align-items: center;
      margin-top: 0.4rem;
    }

    .ep-selector-group select {
      background: #0f1015;
      color: #fff;
      border: 1px solid #2e3346;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      outline: none;
    }

    .close-btn {
      background-color: #381216;
      color: #ff6b6b;
      border: 1px solid #e50914;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    /* Content Grid */
    .section-title {
      font-size: 1.3rem;
      margin-bottom: 1.5rem;
      font-weight: 600;
      color: #e0e0e0;
    }

    .content-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background-color: #161822;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    }

    .card img {
      width: 100%;
      height: 270px;
      object-fit: cover;
      display: block;
      background-color: #232736;
    }

    .card-info {
      padding: 0.8rem;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 0.4rem;
      font-size: 0.8rem;
      color: #a0a0a0;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      background-color: #161822;
      border-top: 1px solid #232736;
      color: #707070;
      font-size: 0.85rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">CineStream</div>
    
    <div class="nav-tabs">
      <button class="nav-btn active" id="btnMovies" onclick="switchCategory('movie')">Movies</button>
      <button class="nav-btn" id="btnTV" onclick="switchCategory('tv')">TV Shows</button>
    </div>

    <div class="header-right">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search any movie or show title...">
        <button class="btn-red" onclick="executeSearch()">Search</button>
      </div>
    </div>
  </header>

  <main>
    <!-- Player Container -->
    <div class="player-container" id="playerContainer">
      <div class="player-wrapper">
        <iframe 
          id="videoPlayer" 
          src="" 
          allowfullscreen 
          allow="autoplay; encrypted-media; picture-in-picture"
          referrerpolicy="origin">
        </iframe>
      </div>
      
      <div class="player-controls">
        <div>
          <div class="player-title" id="playerTitle">Title</div>
          <div class="ep-selector-group" id="epGroup">
            <label>Season:</label>
            <select id="seasonSelect" onchange="loadMediaStream()">
              <option value="1">Season 1</option>
              <option value="2">Season 2</option>
              <option value="3">Season 3</option>
              <option value="4">Season 4</option>
              <option value="5">Season 5</option>
            </select>
            <label>Episode:</label>
            <select id="episodeSelect" onchange="loadMediaStream()">
              <option value="1">Ep 1</option><option value="2">Ep 2</option>
              <option value="3">Ep 3</option><option value="4">Ep 4</option>
              <option value="5">Ep 5</option><option value="6">Ep 6</option>
              <option value="7">Ep 7</option><option value="8">Ep 8</option>
              <option value="9">Ep 9</option><option value="10">Ep 10</option>
            </select>
          </div>
        </div>

        <button class="close-btn" onclick="closePlayer()">Close Player</button>
      </div>
    </div>

    <!-- Content Grid -->
    <h2 class="section-title" id="gridTitle">Popular Movies</h2>
    <div class="content-grid" id="contentGrid"></div>
  </main>

  <footer>
    &copy; CineStream Hub. Powered by VidSrc.
  </footer>

  <script>
    let currentCategory = 'movie';
    let activeMedia = null;

    const contentGrid = document.getElementById('contentGrid');
    const gridTitle = document.getElementById('gridTitle');
    const searchInput = document.getElementById('searchInput');
    const playerContainer = document.getElementById('playerContainer');
    const videoPlayer = document.getElementById('videoPlayer');
    const playerTitle = document.getElementById('playerTitle');
    const epGroup = document.getElementById('epGroup');
    const seasonSelect = document.getElementById('seasonSelect');
    const episodeSelect = document.getElementById('episodeSelect');

    // Built-in catalog with working TMDB IDs for vidsrc.sbs
    const featuredCatalog = {
      movie: [
        { id: 1081003, title: "Gran Turismo", year: "2023", poster: "https://image.tmdb.org/t/p/w500/538416.jpg" },
        { id: 550, title: "Fight Club", year: "1999", poster: "https://image.tmdb.org/t/p/w500/pB8O2CY3kxA16P8y3S351t2A89.jpg" },
        { id: 27205, title: "Inception", year: "2010", poster: "https://image.tmdb.org/t/p/w500/oYuLE291oAev3fRDEC1P9C3vR25.jpg" },
        { id: 157336, title: "Interstellar", year: "2014", poster: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg" },
        { id: 299536, title: "Avengers: Infinity War", year: "2018", poster: "https://image.tmdb.org/t/p/w500/7WsyChLLEz33B3239999.jpg" },
        { id: 155, title: "The Dark Knight", year: "2008", poster: "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911222.jpg" }
      ],
      tv: [
        { id: 1396, title: "Breaking Bad", year: "2008", poster: "https://image.tmdb.org/t/p/w500/zt2A1f133A89f36pP.jpg" },
        { id: 1399, title: "Game of Thrones", year: "2011", poster: "https://image.tmdb.org/t/p/w500/1XS1oqL89f36.jpg" },
        { id: 66732, title: "Stranger Things", year: "2016", poster: "https://image.tmdb.org/t/p/w500/49W146316281.jpg" }
      ]
    };

    function switchCategory(cat) {
      currentCategory = cat;
      document.getElementById('btnMovies').classList.toggle('active', cat === 'movie');
      document.getElementById('btnTV').classList.toggle('active', cat === 'tv');
      gridTitle.innerText = cat === 'movie' ? 'Popular Movies' : 'Popular TV Shows';
      displayGrid(featuredCatalog[currentCategory]);
    }

    async function executeSearch() {
      const query = searchInput.value.trim();
      if (!query) return;

      gridTitle.innerText = `Search Results for: "${query}"`;
      contentGrid.innerHTML = '<p>Searching title database...</p>';

      try {
        // Free public fallback search API
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=${currentCategory === 'movie' ? 'movie' : 'tvShow'}&limit=12`);
        const data = await res.json();

        if (data.results && data.results.length > 0) {
          const results = data.results.map(item => ({
            id: item.trackId,
            title: item.trackName || item.collectionName,
            year: item.releaseDate ? item.releaseDate.split('-')[0] : 'N/A',
            poster: item.artworkUrl100 ? item.artworkUrl100.replace('100x100bb', '600x900bb') : 'https://via.placeholder.com/500x750?text=No+Poster'
          }));
          displayGrid(results);
        } else {
          contentGrid.innerHTML = '<p>No matching titles found. Try another search!</p>';
        }
      } catch (err) {
        // Direct title fallback if search service fails
        displayGrid([{
          id: query,
          title: query,
          year: 'Direct Search',
          poster: 'https://via.placeholder.com/500x750?text=Play+' + encodeURIComponent(query)
        }]);
      }
    }

    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') executeSearch();
    });

    function displayGrid(items) {
      contentGrid.innerHTML = '';
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => selectMedia(item);

        card.innerHTML = `
          <img src="${item.poster}" alt="${item.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/500x750?text=No+Poster'">
          <div class="card-info">
            <div class="card-title">${item.title}</div>
            <div class="card-meta">
              <span>${item.year}</span>
            </div>
          </div>
        `;
        contentGrid.appendChild(card);
      });
    }

    function selectMedia(item) {
      activeMedia = item;
      playerTitle.innerText = item.title;

      if (currentCategory === 'tv') {
        epGroup.style.display = 'flex';
      } else {
        epGroup.style.display = 'none';
      }

      loadMediaStream();
      playerContainer.style.display = 'block';
      playerContainer.scrollIntoView({ behavior: 'smooth' });
    }

    function loadMediaStream() {
      if (!activeMedia) return;

      const mediaId = activeMedia.id;
      let url = '';

      if (currentCategory === 'movie') {
        // Direct vidsrc.sbs routing
        url = `https://vidsrc.sbs/embed/movie/${mediaId}`;
      } else {
        const season = seasonSelect.value || 1;
        const episode = episodeSelect.value || 1;
        url = `https://vidsrc.sbs/embed/tv/${mediaId}/${season}/${episode}`;
      }

      videoPlayer.src = url;
    }

    function closePlayer() {
      videoPlayer.src = '';
      playerContainer.style.display = 'none';
      activeMedia = null;
    }

    // Load initial featured grid
    displayGrid(featuredCatalog.movie);
  </script>
</body>
</html>
