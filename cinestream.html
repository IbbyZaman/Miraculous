<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineStream - Multi-Device Streaming</title>
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #161920;
      --accent-color: #e50914;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: rgba(13, 15, 18, 0.95);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #222;
    }

    .logo { font-size: 1.5rem; font-weight: bold; color: var(--accent-color); }
    .auth-controls { display: flex; gap: 1rem; align-items: center; }

    button {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { opacity: 0.9; }
    button.secondary { background-color: #333; }

    main { padding: 2rem; flex: 1; max-width: 1200px; margin: 0 auto; width: 100%; }

    .player-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    /* Pop-up Shield Sandboxing */
    .player-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .server-picker {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 8px;
    }

    .server-btn {
      background: #252a34;
      font-size: 0.85rem;
      padding: 0.4rem 0.8rem;
    }
    .server-btn.active { background: var(--accent-color); }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .modal-content input {
      padding: 0.75rem;
      border-radius: 4px;
      border: 1px solid #333;
      background: #0d0f12;
      color: #fff;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">CineStream</div>
    <div class="auth-controls">
      <span id="user-display" style="font-size: 0.9rem; color: var(--text-muted);">Guest Mode</span>
      <button id="auth-btn">Login / Sign Up</button>
    </div>
  </header>

  <main>
    <!-- Video Player Frame -->
    <div class="player-container" id="player-box">
      <iframe id="stream-iframe" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
    </div>

    <!-- 14 Provider Switcher -->
    <h3>Select Streaming Server</h3>
    <div class="server-picker" id="server-list"></div>
  </main>

  <!-- Auth Modal -->
  <div class="modal" id="auth-modal">
    <div class="modal-content">
      <h2>Cloud Sync Account</h2>
      <input type="email" id="auth-email" placeholder="Email Address">
      <input type="password" id="auth-password" placeholder="Password">
      <button id="login-submit">Log In</button>
      <button id="signup-submit" class="secondary">Create Account</button>
      <button id="close-modal" class="secondary" style="margin-top: 0.5rem;">Cancel</button>
    </div>
  </div>

  <!-- Firebase Modular SDK Setup -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Your exact Firebase Project Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCWKIQX_4oFrj87GSTsCS9PydnXc7t1bcU",
      authDomain: "cinestream1230.firebaseapp.com",
      databaseURL: "https://cinestream1230-default-rtdb.firebaseio.com",
      projectId: "cinestream1230",
      storageBucket: "cinestream1230.firebasestorage.app",
      messagingSenderId: "523084805053",
      appId: "1:523084805053:web:b356cb9c6d8a8ded7a98d4"
    };

    // Initialize Services
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let currentMedia = { id: "movie-123", type: "movie", time: 0 }; // Default active stream demo

    // 14 Embed Providers Map
    const providers = [
      { name: "Server 1 (vidsrc.me)", url: (id) => `https://vidsrc.me/embed/movie?tmdb=${id}` },
      { name: "Server 2 (vidsrc.to)", url: (id) => `https://vidsrc.to/embed/movie/${id}` },
      { name: "Server 3 (2embed)", url: (id) => `https://www.2embed.cc/embed/${id}` },
      { name: "Server 4 (SuperEmbed)", url: (id) => `https://multiembed.mov/directstream.php?video_id=${id}` },
      { name: "Server 5 (VidLink)", url: (id) => `https://vidlink.pro/movie/${id}` },
      { name: "Server 6 (EmbedSu)", url: (id) => `https://embed.su/embed/movie/${id}` },
      { name: "Server 7 (AutoEmbed)", url: (id) => `https://player.autoembed.cc/embed/movie/${id}` },
      { name: "Server 8 (MovieAPI)", url: (id) => `https://movieapi.club/movie/${id}` },
      { name: "Server 9 (Nonton)", url: (id) => `https://www.NontonGo.win/embed/movie/${id}` },
      { name: "Server 10 (Frembed)", url: (id) => `https://frembed.pro/api/film.php?id=${id}` },
      { name: "Server 11 (Smashy)", url: (id) => `https://embed.smashystream.com/playere.php?tmdb=${id}` },
      { name: "Server 12 (DBGO)", url: (id) => `https://dbgo.fun/video.php?id=${id}` },
      { name: "Server 13 (FlixHQ)", url: (id) => `https://flixhq.click/embed/movie/${id}` },
      { name: "Server 14 (111Movies)", url: (id) => `https://111movies.com/movie/${id}` }
    ];

    // Populate Server Buttons
    const serverListEl = document.getElementById("server-list");
    const iframeEl = document.getElementById("stream-iframe");

    providers.forEach((provider, idx) => {
      const btn = document.createElement("button");
      btn.className = `server-btn ${idx === 0 ? 'active' : ''}`;
      btn.innerText = provider.name;
      btn.onclick = () => {
        document.querySelectorAll(".server-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        iframeEl.src = provider.url("550"); // Example TMDB ID
      };
      serverListEl.appendChild(btn);
    });

    // Default load first provider
    iframeEl.src = providers[0].url("550");

    // Pop-up Shield: Intercept new window popup attempts
    window.open = function () {
      console.warn("Pop-up Shield blocked a popup redirect attempt.");
      return null;
    };

    // Firebase Auth Handlers
    const authBtn = document.getElementById("auth-btn");
    const modal = document.getElementById("auth-modal");
    const closeModal = document.getElementById("close-modal");
    const userDisplay = document.getElementById("user-display");

    authBtn.onclick = () => {
      if (currentUser) {
        signOut(auth);
      } else {
        modal.classList.add("active");
      }
    };

    closeModal.onclick = () => modal.classList.remove("active");

    document.getElementById("login-submit").onclick = async () => {
      const e = document.getElementById("auth-email").value;
      const p = document.getElementById("auth-password").value;
      try {
        await signInWithEmailAndPassword(auth, e, p);
        modal.classList.remove("active");
      } catch (err) { alert(err.message); }
    };

    document.getElementById("signup-submit").onclick = async () => {
      const e = document.getElementById("auth-email").value;
      const p = document.getElementById("auth-password").value;
      try {
        await createUserWithEmailAndPassword(auth, e, p);
        modal.classList.remove("active");
      } catch (err) { alert(err.message); }
    };

    // Auth State Observer
    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      if (user) {
        userDisplay.innerText = user.email;
        authBtn.innerText = "Log Out";
        await loadUserProgress(user.uid);
      } else {
        userDisplay.innerText = "Guest Mode";
        authBtn.innerText = "Login / Sign Up";
      }
    });

    // Firestore Cross-Device Sync Operations
    async function saveProgress(mediaId, timestamp) {
      if (!currentUser) return;
      try {
        await setDoc(doc(db, "users", currentUser.uid, "progress", mediaId), {
          timestamp: timestamp,
          updatedAt: new Date()
        }, { merge: true });
      } catch (e) {
        console.error("Sync error:", e);
      }
    }

    async function loadUserProgress(uid) {
      try {
        const docRef = doc(db, "users", uid, "progress", currentMedia.id);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          console.log("Synced timestamp found:", docSnap.data().timestamp);
        }
      } catch (e) {
        console.error("Error loading progress:", e);
      }
    }

    // Auto-save watch state when switching tabs/closing browser
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden" && currentUser) {
        saveProgress(currentMedia.id, currentMedia.time);
      }
    });
  </script>
</body>
</html>
