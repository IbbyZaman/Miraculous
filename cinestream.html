<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineStream | Custom Player & Cloud Sync</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // REPLACE WITH YOUR FIREBASE CONFIG IF NEEDED
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForCineStreamPlatform12345",
      authDomain: "cinestream-app.firebaseapp.com",
      projectId: "cinestream-app",
      storageBucket: "cinestream-app.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    window.cineAuth = auth;
    window.cineSignIn = () => signInWithPopup(auth, provider).catch(err => console.error("Auth error:", err));
    window.cineSignOut = () => signOut(auth);

    onAuthStateChanged(auth, async (user) => {
      const authBtn = document.getElementById('authBtn');
      const userAvatar = document.getElementById('userAvatar');
      
      if (user) {
        authBtn.innerText = "Sign Out";
        authBtn.onclick = window.cineSignOut;
        if(user.photoURL) {
          userAvatar.src = user.photoURL;
          userAvatar.style.display = 'block';
        }
        await loadHistoryFromCloud(user.uid);
      } else {
        authBtn.innerText = "Sign In";
        authBtn.onclick = openAuthModal;
        userAvatar.style.display = 'none';
      }
    });

    window.syncHistoryToCloud = async function(history) {
      const user = auth.currentUser;
      if (!user) return;
      try {
        await setDoc(doc(db, "users", user.uid), { history }, { merge: true });
      } catch (err) {
        console.error("Cloud sync failed:", err);
      }
    };

    async function loadHistoryFromCloud(uid) {
      try {
        const snap = await getDoc(doc(db, "users", uid));
        if (snap.exists() && snap.data().history) {
          localStorage.setItem('cinestream_history', JSON.stringify(snap.data().history));
          if (window.renderHistory) window.renderHistory();
        }
      } catch (err) {
        console.error("Cloud load failed:", err);
      }
    }
  </script>

  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1c1c22;
      --primary: #e50914;
      --text: #ffffff;
      --text-dim: #a0a0a5;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 50px; }
    
    header {
      background: var(--surface); padding: 15px 25px; display: flex; justify-content: space-between;
      align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #333;
    }
    header h1 { color: var(--primary); font-size: 24px; cursor: pointer; }
    
    .controls { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
    input[type="text"] {
      padding: 10px 15px; border-radius: 20px; border: none; background: #2a2a32;
      color: white; width: 220px; outline: none;
    }
    button {
      padding: 10px 15px; border: none; border-radius: 20px; background: #2a2a32;
      color: white; cursor: pointer; transition: 0.2s; font-weight: bold;
    }
    button:hover { background: #3a3a45; }
    button.active { background: var(--primary); }
    
    .user-profile { display: flex; align-items: center; gap: 10px; }
    .user-profile img { width: 35px; height: 35px; border-radius: 50%; display: none; object-fit: cover; }

    .api-banner { background: #ffcc00; color: #000; padding: 10px; text-align: center; display: none; }
    .api-banner input { padding: 5px; margin: 0 10px; border-radius: 5px; border: 1px solid #000; }
    .api-banner button { background: #000; color: #ffcc00; padding: 5px 10px; border-radius: 5px; }

    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    h2 { margin: 20px 0; font-size: 22px; }

    /* Player Section */
    #playerContainer {
      display: none; background: var(--surface); padding: 20px; border-radius: 12px; margin-bottom: 30px;
    }
    .video-wrapper {
      position: relative; padding-top: 56.25%; width: 100%; background: #000; border-radius: 8px; overflow: hidden;
    }
    video, iframe {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
    }
    
    .player-controls { margin-top: 15px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .ep-group, .server-group { display: flex; gap: 10px; align-items: center; }
    select { padding: 8px; border-radius: 5px; background: #2a2a32; color: white; border: none; }

    /* Grids */
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px;
    }
    .card {
      background: var(--surface); border-radius: 10px; overflow: hidden; cursor: pointer;
      transition: transform 0.2s;
    }
    .card:hover { transform: scale(1.05); }
    .card img { width: 100%; height: 270px; object-fit: cover; }
    .card-info { padding: 10px; }
    .card-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-top: 5px; }
    
    .pagination { display: flex; justify-content: center; gap: 20px; margin-top: 30px; align-items: center; }
    
    /* History Specifics */
    .history-card img { height: 100px; }
    .history-card .card-info { text-align: center; }
    .history-progress { font-size: 12px; color: var(--primary); margin-top: 5px; }

    /* Auth Modal */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;
    }
    .modal.active { display: flex; }
    .modal-content { background: var(--surface); padding: 30px; border-radius: 12px; text-align: center; width: 320px; }
    .modal-content h3 { margin-bottom: 20px; }
    .google-btn { background: #db4437; width: 100%; padding: 12px; border-radius: 8px; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- API Key Banner -->
  <div class="api-banner" id="keyBanner">
    TMDB API Key Required: 
    <input type="text" id="apiKeyInput" placeholder="Enter free TMDB key...">
    <button onclick="saveApiKey()">Save Key</button>
  </div>

  <header>
    <h1 onclick="window.location.reload()">CineStream</h1>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search movies or shows...">
      <button id="btnMovies" class="active" onclick="switchCategory('movie')">Movies</button>
      <button id="btnTV" onclick="switchCategory('tv')">TV Shows</button>
      <div class="user-profile">
        <img id="userAvatar" src="" alt="User">
        <button id="authBtn" onclick="openAuthModal()">Sign In</button>
      </div>
    </div>
  </header>

  <div class="container">
    
    <!-- Video Player Area -->
    <div id="playerContainer">
      <h2 id="playerTitle">Loading...</h2>
      <div class="video-wrapper">
        <video id="nativeVideoPlayer" controls></video>
        <iframe id="iframeFallbackPlayer" allowfullscreen></iframe>
      </div>
      
      <div class="player-controls">
        <div class="ep-group" id="epGroup" style="display: none;">
          <select id="seasonSelect" onchange="updateEpisodeList()"></select>
          <select id="episodeSelect" onchange="loadMediaStream()"></select>
        </div>
        
        <div class="server-group">
          <span>Fallback Server:</span>
          <button class="server-btn active" onclick="switchServer('vidsrc_sbs', this)">VidSrc SBS</button>
          <button class="server-btn" onclick="switchServer('vidsrc_pro', this)">VidSrc Pro</button>
          <button class="server-btn" onclick="switchServer('embed_su', this)">Embed.su</button>
          <button class="server-btn" onclick="switchServer('autoembed', this)">AutoEmbed</button>
        </div>
        <button onclick="closePlayer()" style="background: #333;">Close Player</button>
      </div>
    </div>

    <!-- Continue Watching (History) -->
    <div id="historySection" style="display: none;">
      <h2>Continue Watching</h2>
      <div class="grid" id="historyGrid" style="grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); margin-bottom: 40px;"></div>
      <hr style="border: 0; border-top: 1px solid #333; margin-bottom: 20px;">
    </div>

    <!-- Main Content -->
    <h2 id="gridTitle">Popular Movies</h2>
    <div class="grid" id="contentGrid"></div>

    <div class="pagination">
      <button id="prevBtn" onclick="changePage(-1)">Previous</button>
      <span id="pageInfo">Page 1</span>
      <button id="nextBtn" onclick="changePage(1)">Next</button>
    </div>
  </div>

  <!-- Auth Modal -->
  <div class="modal" id="authModal">
    <div class="modal-content">
      <h3>Sign in to CineStream</h3>
      <p style="color: var(--text-dim); font-size: 14px; margin-bottom: 20px;">Sync your watch history across all devices instantly.</p>
      <button class="google-btn" onclick="handleGoogleSignIn()">Sign in with Google</button>
      <br><br>
      <button onclick="closeAuthModal()" style="background: #333; width: 100%;">Cancel</button>
    </div>
  </div>

  <script>
    // --- APP CONFIG ---
    const BASE_URL = 'https://api.themoviedb.org/3';
    const IMAGE_URL = 'https://image.tmdb.org/t/p/w500';
    const WORKER_URL = "https://cinestream-proxy.0ibbyzaman.workers.dev"; 

    // STATE
    let apiKey = localStorage.getItem('tmdb_api_key') || 'aa9ee919e21a5b01654ced0159fe1244';
    let currentCategory = 'movie';
    let activeMedia = null;
    let activeServer = 'vidsrc_sbs'; 
    let currentPage = 1;
    let totalPages = 1;
    let activeQuery = '';

    // DOM ELEMENTS
    const contentGrid = document.getElementById('contentGrid');
    const gridTitle = document.getElementById('gridTitle');
    const searchInput = document.getElementById('searchInput');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const playerContainer = document.getElementById('playerContainer');
    const iframeFallbackPlayer = document.getElementById('iframeFallbackPlayer');
    const nativeVideoPlayer = document.getElementById('nativeVideoPlayer');
    const playerTitle = document.getElementById('playerTitle');
    const epGroup = document.getElementById('epGroup');
    const seasonSelect = document.getElementById('seasonSelect');
    const episodeSelect = document.getElementById('episodeSelect');
    const keyBanner = document.getElementById('keyBanner');
    const pageInfo = document.getElementById('pageInfo');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    // AUTH MODAL TRIGGERS
    function openAuthModal() { document.getElementById('authModal').classList.add('active'); }
    function closeAuthModal() { document.getElementById('authModal').classList.remove('active'); }
    
    async function handleGoogleSignIn() {
      if (window.cineSignIn) {
        await window.cineSignIn();
        closeAuthModal();
      }
    }

    // --- INITIALIZATION ---
    if (!apiKey) keyBanner.style.display = 'block';
    fetchCatalog();
    renderHistory();

    function saveApiKey() {
      const val = apiKeyInput.value.trim();
      if (!val) return alert('Enter a valid key.');
      localStorage.setItem('tmdb_api_key', val);
      apiKey = val;
      keyBanner.style.display = 'none';
      fetchCatalog();
    }

    // --- CATALOG & SEARCH ---
    function switchCategory(cat) {
      currentCategory = cat;
      activeQuery = ''; searchInput.value = ''; currentPage = 1;
      document.getElementById('btnMovies').classList.toggle('active', cat === 'movie');
      document.getElementById('btnTV').classList.toggle('active', cat === 'tv');
      gridTitle.innerText = cat === 'movie' ? 'Popular Movies' : 'Popular TV Shows';
      fetchCatalog();
    }

    async function fetchCatalog() {
      if (!apiKey) return;
      try {
        const res = await fetch(`${BASE_URL}/${currentCategory}/popular?api_key=${apiKey}&page=${currentPage}`);
        const data = await res.json();
        totalPages = Math.min(data.total_pages || 1, 500);
        updatePagination();
        displayGrid(data.results);
      } catch (err) { contentGrid.innerHTML = `<p>Error loading content.</p>`; }
    }

    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        activeQuery = searchInput.value.trim();
        currentPage = 1;
        activeQuery ? loadSearchResults() : fetchCatalog();
      }
    });

    async function loadSearchResults() {
      gridTitle.innerText = `Search: "${activeQuery}"`;
      try {
        const res = await fetch(`${BASE_URL}/search/${currentCategory}?api_key=${apiKey}&query=${encodeURIComponent(activeQuery)}&page=${currentPage}`);
        const data = await res.json();
        totalPages = data.total_pages || 1;
        updatePagination();
        displayGrid(data.results);
      } catch (err) { contentGrid.innerHTML = `<p>Search error.</p>`; }
    }

    function changePage(dir) {
      currentPage = Math.max(1, Math.min(totalPages, currentPage + dir));
      window.scrollTo({ top: 0, behavior: 'smooth' });
      activeQuery ? loadSearchResults() : fetchCatalog();
    }

    function updatePagination() {
      pageInfo.innerText = `Page ${currentPage} of ${totalPages}`;
      prevBtn.disabled = currentPage <= 1;
      nextBtn.disabled = currentPage >= totalPages;
    }

    function displayGrid(items) {
      contentGrid.innerHTML = items.map(item => {
        const title = item.title || item.name;
        const year = (item.release_date || item.first_air_date || 'N/A').split('-')[0];
        const poster = item.poster_path ? (IMAGE_URL + item.poster_path) : 'https://via.placeholder.com/500x750?text=No+Poster';
        return `
          <div class="card" onclick='selectMedia(${JSON.stringify(item).replace(/'/g, "\\'")})'>
            <img src="${poster}" alt="${title}" loading="lazy">
            <div class="card-info">
              <div class="card-title">${title}</div>
              <div class="card-meta"><span>${year}</span><span>★ ${item.vote_average?.toFixed(1) || 'N/A'}</span></div>
            </div>
          </div>
        `;
      }).join('');
    }

    // --- PLAYER & STREAMING LOGIC ---
    async function selectMedia(item) {
      activeMedia = item;
      playerTitle.innerText = item.title || item.name;
      
      if (currentCategory === 'tv') {
        epGroup.style.display = 'flex';
        await loadTVSeasons(item.id);
      } else {
        epGroup.style.display = 'none';
        loadMediaStream();
      }
      
      playerContainer.style.display = 'block';
      playerContainer.scrollIntoView({ behavior: 'smooth' });
    }

    async function loadTVSeasons(tvId) {
      seasonSelect.innerHTML = '';
      try {
        const res = await fetch(`${BASE_URL}/tv/${tvId}?api_key=${apiKey}`);
        const data = await res.json();
        data.seasons.forEach(s => {
          if (s.season_number > 0) seasonSelect.innerHTML += `<option value="${s.season_number}">Season ${s.season_number}</option>`;
        });
        await updateEpisodeList();
      } catch (err) { console.error("Season load failed"); }
    }

    async function updateEpisodeList() {
      episodeSelect.innerHTML = '';
      const sNum = seasonSelect.value || 1;
      try {
        const res = await fetch(`${BASE_URL}/tv/${activeMedia.id}/season/${sNum}?api_key=${apiKey}`);
        const data = await res.json();
        data.episodes.forEach(ep => {
          episodeSelect.innerHTML += `<option value="${ep.episode_number}">Ep ${ep.episode_number}: ${ep.name}</option>`;
        });
      } catch (err) { console.error("Episode load failed"); }
      loadMediaStream();
    }

    function switchServer(server, btn) {
      activeServer = server;
      document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      if(window.hlsInstance) window.hlsInstance.destroy();
      nativeVideoPlayer.style.display = 'none';
      nativeVideoPlayer.pause();
      iframeFallbackPlayer.style.display = 'block';
      loadIframeFallback();
    }

    function loadMediaStream() {
      if (!activeMedia) return;
      const id = activeMedia.id;
      const season = seasonSelect.value || 1;
      const episode = episodeSelect.value || 1;

      nativeVideoPlayer.style.display = 'block';
      iframeFallbackPlayer.style.display = 'none';

      let rawStreamUrl = currentCategory === 'movie' 
        ? `https://vidsrc.stream/m3u8/movie/${id}`
        : `https://vidsrc.stream/m3u8/tv/${id}/${season}/${episode}`;

      const proxiedStreamUrl = `${WORKER_URL}?url=${encodeURIComponent(rawStreamUrl)}`;

      if (Hls.isSupported()) {
        if (window.hlsInstance) window.hlsInstance.destroy();
        
        const hls = new Hls({
          xhrSetup: function (xhr, url) {
            if (!url.startsWith(WORKER_URL)) xhr.open('GET', `${WORKER_URL}?url=${encodeURIComponent(url)}`, true);
          }
        });

        hls.loadSource(proxiedStreamUrl);
        hls.attachMedia(nativeVideoPlayer);
        window.hlsInstance = hls;

        hls.on(Hls.Events.MANIFEST_PARSED, () => nativeVideoPlayer.play().catch(e => console.log("Autoplay blocked")));
        
        hls.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) {
            console.warn("HLS stream blocked. Falling back to iframe...");
            hls.destroy();
            nativeVideoPlayer.style.display = 'none';
            iframeFallbackPlayer.style.display = 'block';
            loadIframeFallback();
          }
        });
      } else if (nativeVideoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
        nativeVideoPlayer.src = proxiedStreamUrl;
        nativeVideoPlayer.addEventListener('loadedmetadata', () => nativeVideoPlayer.play());
      }

      saveToHistory(activeMedia, currentCategory, season, episode);
    }

    function loadIframeFallback() {
      const id = activeMedia.id;
      const season = seasonSelect.value || 1;
      const episode = episodeSelect.value || 1;
      let url = '';
      
      const type = currentCategory;
      const path = type === 'movie' ? `movie/${id}` : `tv/${id}/${season}/${episode}`;

      if (activeServer === 'vidsrc_sbs') url = `https://vidsrc.sbs/embed/${path}`;
      else if (activeServer === 'vidsrc_pro') url = `https://vidsrc.pro/embed/${path}`;
      else if (activeServer === 'embed_su') url = `https://embed.su/embed/${path}`;
      else if (activeServer === 'autoembed') url = `https://player.autoembed.cc/embed/${path}`;

      iframeFallbackPlayer.src = url;
    }

    function closePlayer() {
      if(window.hlsInstance) window.hlsInstance.destroy();
      nativeVideoPlayer.pause();
      iframeFallbackPlayer.src = '';
      playerContainer.style.display = 'none';
    }

    // --- HISTORY & CLOUD SYNC ---
    function saveToHistory(media, type, season = null, episode = null) {
      let history = JSON.parse(localStorage.getItem('cinestream_history') || '[]');
      history = history.filter(item => item.id !== media.id);
      
      history.unshift({
        id: media.id, title: media.title || media.name, poster: media.poster_path,
        type: type, season: season, episode: episode, timestamp: Date.now()
      });
      if (history.length > 12) history.pop();
      localStorage.setItem('cinestream_history', JSON.stringify(history));
      renderHistory();

      if (window.syncHistoryToCloud) {
        window.syncHistoryToCloud(history);
      }
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('cinestream_history') || '[]');
      const hSection = document.getElementById('historySection');
      const hGrid = document.getElementById('historyGrid');
      
      if (!history.length) { hSection.style.display = 'none'; return; }
      
      hSection.style.display = 'block';
      hGrid.innerHTML = history.map(item => {
        const poster = item.poster ? (IMAGE_URL + item.poster) : 'https://via.placeholder.com/500x750';
        const prog = item.type === 'tv' ? `S${item.season} E${item.episode}` : 'Movie';
        return `
          <div class="card history-card" onclick='resumeFromHistory(${JSON.stringify(item).replace(/'/g, "\\'")})'>
            <img src="${poster}" alt="${item.title}" loading="lazy">
            <div class="card-info">
              <div class="card-title">${item.title}</div>
              <div class="history-progress">${prog}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    window.renderHistory = renderHistory;

    async function resumeFromHistory(item) {
      currentCategory = item.type;
      document.getElementById('btnMovies').classList.toggle('active', item.type === 'movie');
      document.getElementById('btnTV').classList.toggle('active', item.type === 'tv');

      try {
        const res = await fetch(`${BASE_URL}/${item.type}/${item.id}?api_key=${apiKey}`);
        activeMedia = await res.json();
        playerTitle.innerText = activeMedia.title || activeMedia.name;

        if (item.type === 'tv') {
          epGroup.style.display = 'flex';
          await loadTVSeasons(activeMedia.id);
          if (item.season) seasonSelect.value = item.season;
          await updateEpisodeList();
          if (item.episode) episodeSelect.value = item.episode;
        } else {
          epGroup.style.display = 'none';
        }
        
        loadMediaStream();
        playerContainer.style.display = 'block';
        playerContainer.scrollIntoView({ behavior: 'smooth' });
      } catch (err) { console.error('History resume failed', err); }
    }
  </script>
</body>
</html>
