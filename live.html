<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<link rel="icon" type="image/png" href="favicon.png">
<title>MiraculousHub Live</title>
<link rel="stylesheet" href="styles.css?v=account-v4-1">
<style>
.live-page{max-width:1100px;margin:clamp(28px,6vw,72px) auto;padding:0 20px 48px}
.live-heading{margin-bottom:22px}.live-heading .kicker{color:#ff4f88;font-size:11px;font-weight:800;letter-spacing:.18em}.live-heading h1{margin:8px 0;font-size:clamp(28px,5vw,44px);letter-spacing:-.04em}.live-heading p{color:var(--muted,#a8a9ba)}
.twitch-card{overflow:hidden;border:1px solid rgba(255,255,255,.13);border-radius:20px;background:rgba(255,255,255,.035)}
.twitch-frame{width:100%;aspect-ratio:16/9;background:#000}.twitch-frame iframe{width:100%;height:100%;border:0;display:block}
.live-player-info{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 20px}.live-player-info strong,.live-player-info span{display:block}.live-player-info span{margin-top:5px;color:var(--muted,#a8a9ba);font-size:13px}
.live-action{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;padding:11px 15px;background:linear-gradient(110deg,#ff4f88,#a72eff);color:white;text-decoration:none;font-weight:750;white-space:nowrap}
.back-home{display:inline-flex;margin-top:20px;color:var(--muted,#a8a9ba);text-decoration:none}
@media(max-width:560px){.live-player-info{align-items:flex-start;flex-direction:column}.live-action{width:100%}.twitch-frame{aspect-ratio:4/3}}
</style>
</head>
<body>
<header class="topbar">
 <a class="brand" href="index.html" aria-label="MiraculousHub home"><span class="brand-mark">M</span><span class="brand-text">MIRACULOUS<span>HUB</span></span></a>
 <nav class="nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="episodes.html">Episodes</a><a href="index.html#upcoming-releases">Upcoming Releases</a><a href="monthly-animes.html">Monthly Animes</a><a href="app.html">Apps</a></nav>
 <div class="actions"><a class="live-action" href="https://www.twitch.tv/miraculoust0" target="_blank" rel="noopener noreferrer">Open Twitch ↗</a></div>
</header>
<main class="live-page">
 <div class="live-heading"><p class="kicker">● LIVE</p><h1>MiraculousHub Live</h1><p id="liveDescription">The stream will appear here when Miraculoust0 is live on Twitch.</p></div>
 <section class="twitch-card" aria-label="Twitch live stream">
  <div class="twitch-frame"><iframe src="https://player.twitch.tv/?channel=miraculoust0&parent=miraculoushub.co.uk&parent=www.miraculoushub.co.uk&autoplay=false" title="Miraculoust0 Twitch live stream" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>
  <div class="live-player-info"><div><strong>MiraculousHub Live</strong><span>Live on Twitch · @miraculoust0</span></div><a class="live-action" href="https://www.twitch.tv/miraculoust0" target="_blank" rel="noopener noreferrer">Watch on Twitch ↗</a></div>
 </section>
 <a class="back-home" href="index.html#upcoming-releases">← Back to countdowns</a>
</main>
<script>
const episode=new URLSearchParams(location.search).get('episode');
if(episode){const el=document.getElementById('liveDescription');el.textContent='Season 7 Episode '+episode+' has reached its scheduled release time. Watch the Twitch stream below.';}
</script>
</body>
</html>
